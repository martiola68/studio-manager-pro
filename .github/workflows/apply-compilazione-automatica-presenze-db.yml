name: Apply compilazione automatica presenze DB

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-compilazione-automatica-presenze-db.yml
      - supabase/migrations/20261001103000_compilazione_automatica_presenze.sql

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted migration via direct DB
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=db.ngeltlygytupgdjiagve.supabase.co port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=10" \
            -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261001103000_compilazione_automatica_presenze.sql

      - name: Verify column
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          count=$(PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "host=db.ngeltlygytupgdjiagve.supabase.co port=5432 dbname=postgres user=postgres sslmode=require connect_timeout=10" \
            -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='tbdipendenti' and column_name='compilazione_automatica_presenze';")
          echo "Column found: $count"
          test "$count" = "1"

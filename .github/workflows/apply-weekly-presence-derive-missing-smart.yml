name: Apply weekly smart group live fallback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-weekly-presence-derive-missing-smart-once.py'
      - '.github/workflows/apply-weekly-presence-derive-missing-smart.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/patch-weekly-presence-derive-missing-smart-once.py

      - name: Commit runtime change
        run: |
          if git diff --quiet -- src/pages/presenze/assenze-settimanali.tsx; then
            echo "No runtime changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/assenze-settimanali.tsx
          git commit -m "Derive missing weekly smart values from group configuration"
          git pull --rebase origin main
          git push origin main

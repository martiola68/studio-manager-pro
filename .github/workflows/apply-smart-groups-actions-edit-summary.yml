name: Apply smart group actions edit summary

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-smart-groups-actions-edit-summary.yml
      - scripts/patch-smart-groups-actions-edit-summary-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply smart groups UI patch
        run: python scripts/patch-smart-groups-actions-edit-summary-once.py

      - name: Verify runtime changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'title="Modifica gruppo"' src/pages/presenze/smart-gruppi.tsx
          grep -q 'title="Elimina gruppo"' src/pages/presenze/smart-gruppi.tsx
          grep -q 'Salva modifiche' src/pages/presenze/smart-gruppi.tsx
          grep -q 'Smart working tutta la settimana' src/pages/presenze/smart-gruppi.tsx

      - name: Commit runtime page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/smart-gruppi.tsx
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Move smart group actions to configured groups table"
          git pull --rebase origin main
          git push origin HEAD:main

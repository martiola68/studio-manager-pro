name: One shot - fix Bilanci build
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-bilanci-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix duplicate JSX attribute
        run: |
          python .github/scripts/fix_bilanci_duplicate_classname.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/bilanci.tsx
          git commit -m 'Fix Bilanci duplicate JSX className'
          git push origin main

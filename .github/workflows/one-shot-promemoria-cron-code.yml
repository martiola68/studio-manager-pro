name: One-shot promemoria cron code patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[promemoria-cron-code-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current promemoria cron and clean legacy hook
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=None):
              actual = text.count(old)
              if actual == 0:
                  raise SystemExit(f"Pattern non trovato: {label}")
              if count is not None and actual != count:
                  raise SystemExit(f"Conteggio inatteso per {label}: {actual}, atteso {count}")
              return text.replace(old, new)

          # 1) Aggancio del codice SOLO al cron Promemoria realmente in uso.
          p = Path('src/pages/api/promemoria/alert.ts')
          s = p.read_text()

          s = must_replace(
              s,
              '      if (studioError || !studio?.microsoft_connection_id) {\n        saltati++;\n        continue;\n      }\n\n const subject =',
              '      if (studioError || !studio?.microsoft_connection_id) {\n        saltati++;\n        continue;\n      }\n\n      const codicePromemoria = (p as any).codice_promemoria || "-";\n\n const subject =',
              'variabile codice nel cron', 1
          )
          s = must_replace(
              s,
              '? `Promemoria scaduto: ${p.titolo}`\n    : tipoAlert === "oggi"\n      ? `Promemoria in scadenza oggi: ${p.titolo}`\n      : `Promemoria in scadenza tra ${giorniRimasti} giorni: ${p.titolo}`;',
              '? `[${codicePromemoria}] Promemoria scaduto: ${p.titolo}`\n    : tipoAlert === "oggi"\n      ? `[${codicePromemoria}] Promemoria in scadenza oggi: ${p.titolo}`\n      : `[${codicePromemoria}] Promemoria in scadenza tra ${giorniRimasti} giorni: ${p.titolo}`;',
              'oggetto email cron', 1
          )
          s = must_replace(
              s,
              '          <ul>\n            <li><strong>Titolo:</strong> ${p.titolo}</li>',
              '          <ul>\n            <li><strong>Codice:</strong> ${codicePromemoria}</li>\n            <li><strong>Titolo:</strong> ${p.titolo}</li>',
              'codice corpo email cron', 1
          )
          p.write_text(s)

          # 2) Rimuove SOLO le aggiunte fatte per errore nella funzione legacy +7/0.
          #    La funzione legacy resta identica a prima: nessuna sua logica viene modificata.
          p = Path('src/services/promemoriaService.ts')
          s = p.read_text()

          s = must_replace(
              s,
              '      const dataScadenzaFormattata = new Date(p.data_scadenza).toLocaleDateString("it-IT");\n      const codicePromemoria = (p as any).codice_promemoria || "-";',
              '      const dataScadenzaFormattata = new Date(p.data_scadenza).toLocaleDateString("it-IT");',
              'rimozione variabile codice legacy', 1
          )
          s = must_replace(
              s,
              'Codice: ${codicePromemoria}\nPromemoria: ${p.titolo}',
              'Promemoria: ${p.titolo}',
              'rimozione codice messaggio legacy', 1
          )
          s = must_replace(
              s,
              '? `[${codicePromemoria}] Promemoria in scadenza tra 7 giorni: ${p.titolo}`\n              : `[${codicePromemoria}] Promemoria in scadenza oggi: ${p.titolo}`;',
              '? `Promemoria in scadenza tra 7 giorni: ${p.titolo}`\n              : `Promemoria in scadenza oggi: ${p.titolo}`;',
              'ripristino subject legacy', 1
          )
          s = must_replace(
              s,
              '              <ul>\n                <li><strong>Codice:</strong> ${codicePromemoria}</li>\n                <li><strong>Titolo:</strong> ${p.titolo}</li>',
              '              <ul>\n                <li><strong>Titolo:</strong> ${p.titolo}</li>',
              'ripristino html legacy', 1
          )
          s = must_replace(
              s,
              '${giorniRimasti === 7 ? "Promemoria in scadenza tra 7 giorni" : "Promemoria in scadenza oggi"}\n\nCodice: ${codicePromemoria}\nTitolo:',
              '${giorniRimasti === 7 ? "Promemoria in scadenza tra 7 giorni" : "Promemoria in scadenza oggi"}\n\nTitolo:',
              'ripristino testo legacy', 1
          )
          p.write_text(s)

          # Workflow one-shot: si elimina nel commit applicativo.
          Path('.github/workflows/one-shot-promemoria-cron-code.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/api/promemoria/alert.ts src/services/promemoriaService.ts .github/workflows/one-shot-promemoria-cron-code.yml
          git commit -m "fix: collega codice promemoria al cron attuale [promemoria-cron-code-patch]"
          git push origin main

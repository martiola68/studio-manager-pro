name: One-shot fix auth solleciti presenze
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auth-solleciti-presenze-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggiunge bearer token alla chiamata solleciti
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/presenze/index.tsx')
          s = p.read_text()
          old = '''        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
        });'''
          new = '''        const supabase = getBrowserSupabaseClient();
        const { data: { session } } = await supabase.auth.getSession();
        const accessToken = session?.access_token;

        if (!accessToken) {
          throw new Error("Sessione non disponibile");
        }

        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        });'''
          if old not in s:
            raise SystemExit('blocco fetch solleciti non trovato')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/one-shot-fix-auth-solleciti-presenze.yml').unlink()
          PY
      - name: Verifica diff
        run: |
          git diff --check
          git diff -- src/pages/presenze/index.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/index.tsx .github/workflows/one-shot-fix-auth-solleciti-presenze.yml
          git commit -m "fix: autentica correttamente solleciti presenze [auth-solleciti-presenze-fixed]"
          git push origin main

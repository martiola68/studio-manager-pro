name: Apply CU row style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-cu-style.yml
      - scripts/patch-cu-style-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply CU style patch
        run: python scripts/patch-cu-style-once.py
      - name: Verify CU style
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bg-blue-100 hover:bg-blue-100' src/pages/scadenze/cu.tsx
          grep -Fq '[&_select]:!text-red-600' src/pages/scadenze/cu.tsx
          ! grep -q 'bg-gray-200 hover:bg-gray-200' src/pages/scadenze/cu.tsx
          ! grep -q '!bg-green-300' src/pages/scadenze/cu.tsx
      - name: Commit runtime file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/scadenze/cu.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align CU row colors with IVA"
          git pull --rebase origin main
          git push origin HEAD:main

name: One shot - IMU soggetto schema
on:
  push:
    paths:
      - '.github/workflows/one-shot-imu-soggetto-schema.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Align IMU runtime and alerts
        run: |
          python .github/scripts/patch_imu_soggetto_schema.py
          if grep -q 'acconto_imu' src/pages/scadenze/imu.tsx; then exit 1; fi
          if grep -q 'saldo_imu' src/pages/scadenze/imu.tsx; then exit 1; fi
          if grep -q 'acconto_imu' src/services/scadenzaAlertService.ts; then exit 1; fi
          if grep -q 'saldo_imu' src/services/scadenzaAlertService.ts; then exit 1; fi
          grep -q 'soggetto_imu' src/pages/scadenze/imu.tsx
          grep -q 'soggetto_imu' src/services/scadenzaAlertService.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/imu.tsx src/services/scadenzaAlertService.ts src/integrations/supabase/database.types.ts src/lib/supabase/database.types.ts
          git commit -m 'Align IMU runtime to single soggetto_imu flag'
          git push origin main

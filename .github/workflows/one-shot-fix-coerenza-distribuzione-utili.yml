name: One-shot fix coerenza distribuzione utili
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[coerenza-distribuzione-utili-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica fix mirato
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('src/pages/api/pratiche/variazioni/index.ts')
          a = api.read_text()

          old = '''if (error) throw error;\n\nconst variazioniIds = (data || []).map((v: any) => v.id);'''
          new = '''if (error) throw error;\n\nconst distribuzioniSenzaPratica = (data || []).filter(\n  (v: any) =>\n    String(v.tipo_variazione || "").toLowerCase().includes("distribuzione") &&\n    !v.pratica_id\n);\n\nif (distribuzioniSenzaPratica.length > 0) {\n  const idsVariazione = distribuzioniSenzaPratica.map((v: any) => v.id);\n  const { data: praticheCollegate, error: praticheCollegateError } = await supabase\n    .from("tbpratiche")\n    .select("id, variazione_id, created_at")\n    .in("variazione_id", idsVariazione)\n    .order("created_at", { ascending: false });\n\n  if (praticheCollegateError) throw praticheCollegateError;\n\n  const praticaByVariazione = new Map<string, string>();\n  for (const pratica of praticheCollegate || []) {\n    if (pratica.variazione_id && !praticaByVariazione.has(String(pratica.variazione_id))) {\n      praticaByVariazione.set(String(pratica.variazione_id), String(pratica.id));\n    }\n  }\n\n  for (const variazione of distribuzioniSenzaPratica) {\n    const praticaIdRipristinata = praticaByVariazione.get(String(variazione.id));\n    if (!praticaIdRipristinata) continue;\n\n    variazione.pratica_id = praticaIdRipristinata;\n    await supabase\n      .from("tbpratiche_variazioni")\n      .update({ pratica_id: praticaIdRipristinata })\n      .eq("id", variazione.id);\n  }\n}\n\nconst variazioniIds = (data || []).map((v: any) => v.id);'''
          if old not in a:
            raise SystemExit('punto recupero pratica_id non trovato')
          a = a.replace(old, new, 1)

          old = '''  return {\n    ...v,\n\n  step_determina_stato:'''
          new = '''  const statoDistribuzione =\n    isDistribuzioneUtili\n      ? verbaleGenerato && v.conferma_record === true\n        ? "completata"\n        : "in_lavorazione"\n      : v.stato;\n\n  return {\n    ...v,\n    stato: statoDistribuzione,\n\n  step_determina_stato:'''
          if old not in a:
            raise SystemExit('punto stato distribuzione non trovato')
          a = a.replace(old, new, 1)

          old = '''      const payload = buildPayload(body);'''
          new = '''      const { data: variazioneEsistente, error: variazioneEsistenteError } = await supabase\n        .from("tbpratiche_variazioni")\n        .select("pratica_id")\n        .eq("id", id)\n        .single();\n\n      if (variazioneEsistenteError) throw variazioneEsistenteError;\n\n      const payload = buildPayload({\n        ...body,\n        pratica_id:\n          body.pratica_id !== undefined\n            ? body.pratica_id\n            : variazioneEsistente?.pratica_id || null,\n      });'''
          if a.count(old) != 1:
            raise SystemExit(f'payload PUT atteso 1, trovato {a.count(old)}')
          a = a.replace(old, new, 1)
          api.write_text(a)

          page = Path('src/pages/pratiche/variazioni.tsx')
          s = page.read_text()
          old = '''if (v.tipo_variazione === "Distribuzione utili") {\n  steps = [v.step_verbale_stato || "da_fare"];\n}'''
          new = '''if (v.tipo_variazione === "Distribuzione utili") {\n  steps = [\n    v.step_verbale_stato || "da_fare",\n    v.conferma_record === true\n      ? "completato"\n      : v.data_comunicazione_ade\n      ? "in_lavorazione"\n      : "da_fare",\n  ];\n}'''
          if old not in s:
            raise SystemExit('blocco avanzamento distribuzione non trovato')
          s = s.replace(old, new, 1)
          page.write_text(s)

          Path('.github/workflows/one-shot-fix-coerenza-distribuzione-utili.yml').unlink()
          PY
      - name: Verifica diff
        run: |
          git diff --check
          git diff -- src/pages/api/pratiche/variazioni/index.ts src/pages/pratiche/variazioni.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/api/pratiche/variazioni/index.ts src/pages/pratiche/variazioni.tsx .github/workflows/one-shot-fix-coerenza-distribuzione-utili.yml
          git commit -m "fix: rende coerenti stato e avanzamento distribuzione utili [coerenza-distribuzione-utili-fixed]"
          git push origin main

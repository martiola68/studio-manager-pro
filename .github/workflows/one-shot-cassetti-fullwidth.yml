name: One-shot cassetti fiscali full width

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cassetti-fullwidth]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand cassetti fiscali page width
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/cassetti-fiscali/index.tsx')
          s = p.read_text()

          old = '<div className="max-w-7xl mx-auto p-4 md:p-8">'
          new = '<div className="w-full max-w-none mx-auto px-4 md:px-6 xl:px-8 py-4 md:py-8">'

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Contenitore pagina: atteso 1, trovato {count}')

          s = s.replace(old, new)
          p.write_text(s)

          Path('.github/workflows/one-shot-cassetti-fullwidth.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/cassetti-fiscali/index.tsx .github/workflows/one-shot-cassetti-fullwidth.yml
          git commit -m "style: amplia pagina cassetti fiscali [cassetti-fullwidth]"
          git push origin main

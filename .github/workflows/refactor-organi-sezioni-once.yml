                <div><label style={labelStyle}>Quota %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_partecipazione} onChange={(e) => { const valore=e.target.value; setForm((p) => ({ ...p, percentuale_partecipazione: valore, percentuale_diritti_voto: p.titolo_possesso === "piena_proprieta" ? valore : p.percentuale_diritti_voto, percentuale_diritti_utili: p.titolo_possesso === "piena_proprieta" ? valore : p.percentuale_diritti_utili })); }} /></div>

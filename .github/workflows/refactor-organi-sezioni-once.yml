        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginTop: 10 }}>
          <button type="button" style={secondaryButton} onClick={() => { setNominativoInModificaId(null); setNuovoNominativo({ nome_cognome: "", codice_fiscale: "", email: "", luogo_nascita: "", data_nascita: "", indirizzo: "", citta: "", provincia: "", cap: "", tipologia_cliente: "Persona fisica" }); setShowNuovoNominativo(true); }}>+ Nuovo</button>

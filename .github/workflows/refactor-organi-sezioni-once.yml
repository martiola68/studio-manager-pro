name: Refactor organi sections once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-organi-sezioni-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor only Soci e Organi sociali page
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/clienti/organi-sociali.tsx")
          text = path.read_text(encoding="utf-8")
          original = text

          marker = '''const ruoliConPrincipale = [
  "amministratore",
  "amministratore_unico",
  "amministratore_delegato",
  "presidente_cda",
  "vice_presidente_cda",
  "consigliere",
  "liquidatore",
  "rappresentante_legale",
];
'''
          addition = marker + '''
const ruoliAmministrazione = [
  "amministratore",
  "amministratore_unico",
  "amministratore_delegato",
  "consigliere_delegato",
  "presidente_cda",
  "vice_presidente_cda",
  "consigliere",
  "liquidatore",
  "rappresentante_legale",
];

const ruoliControllo = [
  "sindaco_effettivo",
  "presidente_collegio_sindacale",
  "sindaco_unico",
  "sindaco_supplente",
  "revisore",
];
'''
          if text.count(marker) != 1:
              raise SystemExit("ruoli marker mismatch")
          text = text.replace(marker, addition, 1)

          state_marker = 'const [messaggio, setMessaggio] = useState("");\n'
          state_add = state_marker + '''const [modalSezione, setModalSezione] = useState<"soci" | "amministrazione" | "controllo" | null>(null);
const [ricercaNominativo, setRicercaNominativo] = useState("");
const [ricercaApplicata, setRicercaApplicata] = useState("");
'''
          if text.count(state_marker) != 1:
              raise SystemExit("state marker mismatch")
          text = text.replace(state_marker, state_add, 1)

          return_marker = 'return (\n  <main\n'
          helpers = '''const sociVisualizzati = organi.filter((organo) => organo.ruolo === "socio");
const amministrazioneVisualizzata = organi.filter((organo) =>
  ruoliAmministrazione.includes(String(organo.ruolo || ""))
);
const controlloVisualizzato = organi.filter((organo) =>
  ruoliControllo.includes(String(organo.ruolo || ""))
);

const nominativiRicercati = nominativi.filter((nominativo) => {
  const q = ricercaApplicata.trim().toLowerCase();
  if (!q) return true;
  return [
    nominativo.ragione_sociale,
    nominativo.codice_fiscale,
    nominativo.partita_iva,
  ].some((valore) => String(valore || "").toLowerCase().includes(q));
});

function apriInserimentoSezione(sezione: "soci" | "amministrazione" | "controllo") {
  setOrganoInModificaId("");
  setDirittiCollegati([]);
  setErroreDiritti("");

      </tbody>
    </table>
  </div>

  <div style={{ marginTop: 14, padding: "12px 14px", borderRadius: 9, background: totaleQuoteCorretto ? "#dcfce7" : "#fee2e2", color: totaleQuoteCorretto ? "#166534" : "#991b1b", fontWeight: 800, display: "flex", justifyContent: "space-between" }}>
    <span>Totale quote societarie</span><span>{totaleQuote.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%</span>
  </div>
</div>

<div style={{ ...cardStyle, border: "1px solid #dbeafe" }}>

        <button type="button" onClick={() => setModalSezione(null)} style={{ border: 0, background: "transparent", color: "#fff", fontSize: 22, cursor: "pointer" }}>×</button>
      </div>

      <div style={{ padding: 20 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, alignItems: "end" }}>

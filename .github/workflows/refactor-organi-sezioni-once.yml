      <button type="button" style={blueButton} onClick={() => apriInserimentoSezione("controllo")}>+ Aggiungi componente</button>
    </div>
    <div style={{ marginTop: 16, overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead><tr><th style={thStyle}>Nominativo</th><th style={thStyle}>Codice fiscale</th><th style={thStyle}>Qualifica</th><th style={thStyle}>Dal</th><th style={thStyle}>Al</th><th style={thStyle}>Azioni</th></tr></thead>
        <tbody>{controlloVisualizzato.map((o) => <tr key={o.id}><td style={tdStyle}>{o.soggetto_cliente?.ragione_sociale || "—"}</td><td style={tdStyle}>{o.soggetto_cliente?.codice_fiscale || o.soggetto_cliente?.partita_iva || "—"}</td><td style={tdStyle}>{o.carica || ruoliLabel[o.ruolo] || "—"}</td><td style={tdStyle}>{formattaDataItaliana(o.data_nomina)}</td><td style={tdStyle}>{formattaDataItaliana(o.data_scadenza)}</td><td style={tdStyle}><div style={{ display: "flex", gap: 8 }}><button type="button" style={iconButton} title="Modifica" onClick={() => void apriModificaSezione(o, "controllo")}><Pencil size={16} /></button>{o.attivo && <button type="button" style={iconButton} title="Disattiva" onClick={() => disattivaOrgano(o)}><Power size={16} /></button>}<button type="button" style={iconDangerButton} title="Elimina" onClick={() => eliminaOrgano(o)}><Trash2 size={16} /></button></div></td></tr>)}</tbody>
      </table>
    </div>

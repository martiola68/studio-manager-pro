          text = text[:i] + replacement + text[j:]

          forbidden = ["Aggiungi socio / organo", "Soci / Organi collegati"]
          leftovers = [x for x in forbidden if x in text]
          if leftovers:
              raise SystemExit(f"old layout leftovers: {leftovers}")
          if text == original:
              raise SystemExit("no application change")

          path.write_text(text, encoding="utf-8")

      - name: Verify only target page changed and commit
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "src/pages/clienti/organi-sociali.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx
          git commit -m "Refactor Soci e Organi sociali into dedicated sections"
          git push origin HEAD:main

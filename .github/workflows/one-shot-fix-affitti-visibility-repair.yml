name: One shot - Fix Affitti visibility repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-affitti-visibility-repair.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Affitti visibility repair
        run: |
          python .github/scripts/patch_affitti_visibility_repair.py
          grep -q 'ripristina-visibilita' src/pages/scadenze/affitti/index.tsx
          npm ci
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/affitti/index.tsx
          git commit -m 'Repair historical Affitti tenant visibility on load'
          git push origin main

name: Rubrica new contact links

on:
  push:
    paths:
      - '.github/workflows/one-shot-rubrica-new-contact-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Rubrica new-contact linking
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/contatti/index.tsx')
          s = p.read_text()
          original = s

          # New-contact modal: show the same Clienti collegati panel used in edit mode.
          target = '{editingContatto && (\n  <div className="rounded-lg border border-blue-200 bg-blue-50 p-4">'
          replacement = '{(\n  <div className="rounded-lg border border-blue-200 bg-blue-50 p-4">'
          if target in s:
            s = s.replace(target, replacement, 1)

          # Reset pending association fields whenever a new contact form is opened/reset.
          old_reset = '''  const resetForm = () => {
    setFormData(initialFormData);
    setEditingContatto(null);
  };'''
          new_reset = '''  const resetForm = () => {
    setFormData(initialFormData);
    setEditingContatto(null);
    setClienteDaCollegare("");
    setRuoloCliente("");
    setEmailSocieta("");
    setTelefonoSocieta("");
    setPecSocieta("");
  };'''
          if old_reset in s:
            s = s.replace(old_reset, new_reset, 1)

          # When saving a brand-new contact, persist a pending client/contact association.
          anchor = '''} else {
  const nuovoContatto = await contattoService.createContatto(dataToSave);
'''
          if anchor in s and 'tipoCollegamento' not in s:
            insert = '''} else {
  const nuovoContatto = await contattoService.createContatto(dataToSave);

  if (clienteDaCollegare) {
    const [tipoCollegamento, idCollegamento] = clienteDaCollegare.split(":");

    if (tipoCollegamento === "cliente" && idCollegamento) {
      await contattoService.collegaCliente({
        studio_id: studioId,
        contatto_id: nuovoContatto.id,
        cliente_id: idCollegamento,
        ruolo: ruoloCliente || null,
        principale: false,
        riceve_comunicazioni: true,
        riceve_scadenze: true,
        email_societa: emailSocieta || null,
        telefono_societa: telefonoSocieta || null,
        pec_societa: pecSocieta || null,
      });
    }

    if (tipoCollegamento === "contatto" && idCollegamento) {
      const supabaseRel = getSupabaseClient();
      const { error: relazioneError } = await (supabaseRel as any)
        .from("tbcontatti_relazioni")
        .insert({
          contatto_id: nuovoContatto.id,
          contatto_collegato_id: idCollegamento,
        });

      if (relazioneError) throw relazioneError;
    }
  }
'''
            s = s.replace(anchor, insert, 1)

          # Make the button meaningful also while creating a contact.
          old_button = '''  <Button
    type="button"
    onClick={() => void handleCollegaCliente()}
    className="bg-blue-600 hover:bg-blue-700"
  >
    <Link2 className="mr-2 h-4 w-4" />
    Collega
  </Button>'''
          new_button = '''  <Button
    type="button"
    onClick={() => {
      if (editingContatto) {
        void handleCollegaCliente();
        return;
      }

      if (!clienteDaCollegare) {
        toast({
          title: "Attenzione",
          description: "Seleziona un cliente o un contatto da collegare.",
          variant: "destructive",
        });
        return;
      }

      toast({
        title: "Collegamento pronto",
        description: "Verrà creato automaticamente quando salvi il nuovo contatto.",
      });
    }}
    className="bg-blue-600 hover:bg-blue-700"
  >
    <Link2 className="mr-2 h-4 w-4" />
    {editingContatto ? "Collega" : "Collega al salvataggio"}
  </Button>'''
          if old_button in s:
            s = s.replace(old_button, new_button, 1)

          if s == original:
            raise SystemExit('No Rubrica changes were applied')

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "studio-manager-bot"
          git config user.email "actions@github.com"
          git add src/pages/contatti/index.tsx
          git commit -m "Show and save contact links in new Rubrica form"
          git push origin HEAD:main

name: Fix auth solleciti presenze v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mirata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/presenze/index.tsx')
          s = p.read_text()
          old = '''        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
        });'''
          new = '''        const supabase = getBrowserSupabaseClient();
        const { data: { session } } = await supabase.auth.getSession();
        const accessToken = session?.access_token;

        if (!accessToken) {
          throw new Error("Sessione non disponibile");
        }

        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        });'''
          if old not in s:
            raise SystemExit('blocco fetch non trovato')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/index.tsx
          git commit -m "fix: passa sessione ai solleciti presenze" || exit 0
          git push origin main

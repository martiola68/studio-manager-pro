name: One-shot distribuzione utili solo AdE v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[distribuzione-utili-ade-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica patch già verificata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-distribuzione-utili-ade.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(src) if "python3 - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end])
          Path('/tmp/applica_patch.py').write_text(code)
          exec(compile(code, '/tmp/applica_patch.py', 'exec'))
          Path('.github/workflows/one-shot-distribuzione-utili-ade-v2.yml').unlink()
          PY
      - name: Verifica file modificati
        run: |
          git diff --check
          git diff --name-only
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/pratiche/variazioni.tsx src/pages/api/pratiche/variazioni/index.ts .github/workflows/one-shot-distribuzione-utili-ade.yml .github/workflows/one-shot-distribuzione-utili-ade-v2.yml
          git commit -m "fix: distribuzione utili solo Agenzia Entrate [distribuzione-utili-ade-fixed]"
          git push origin main

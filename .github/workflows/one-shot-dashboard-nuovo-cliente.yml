name: One shot dashboard nuovo cliente

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-dashboard-nuovo-cliente-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dashboard nuovo cliente fix
        run: python scripts/fix-dashboard-nuovo-cliente-once.py

      - name: Verify changed files
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/pages/clienti/index.tsx' 'src/pages/dashboard.tsx' | sort)"
          test "$changed" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript guard
        run: npx tsc --noEmit

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard.tsx src/pages/clienti/index.tsx
          git commit -m "Fix dashboard Nuovo cliente navigation"
          git push origin HEAD:main

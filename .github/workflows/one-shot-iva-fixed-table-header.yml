name: One shot - IVA fixed table header

on:
  push:
    paths:
      - '.github/workflows/one-shot-iva-fixed-table-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore normal table and keep labels fixed
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/scadenze/iva.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # Restore the table card to a normal scroll viewport.
          s = s.replace(
              '<CardContent className="min-h-0 flex-1 overflow-hidden p-0">\n          <div className="relative h-full w-full overflow-x-auto overflow-y-hidden">',
              '<CardContent className="min-h-0 flex-1 overflow-hidden p-0">\n          <div className="relative h-full w-full overflow-auto">',
              1,
          )

          # Restore native table layout; sticky THEAD keeps labels fixed while only rows move beneath it.
          s = s.replace(
              '<table className="flex h-full min-w-max w-full flex-col caption-bottom text-sm">',
              '<table className="w-full caption-bottom text-sm">',
              1,
          )
          s = s.replace(
              '<thead className="z-30 block shrink-0 bg-slate-600 text-white shadow-sm [&_tr]:border-b [&_tr]:border-slate-500">',
              '<thead className="sticky top-0 z-30 bg-slate-600 text-white shadow-sm [&_tr]:border-b [&_tr]:border-slate-500">',
              1,
          )
          s = s.replace(
              '<tr className="table w-full table-fixed border-b border-slate-500">',
              '<tr className="border-b border-slate-500">',
              1,
          )
          s = s.replace(
              '<tbody className="block min-h-0 flex-1 overflow-y-auto [&_tr:last-child]:border-0">',
              '<tbody className="[&_tr:last-child]:border-0">',
              1,
          )
          s = s.replace(
              'className="table w-full table-fixed border-b transition-colors hover:bg-muted/50"',
              'className="border-b transition-colors hover:bg-muted/50"',
              1,
          )
          s = s.replace(
              'className={`table w-full table-fixed border-b transition-colors ${',
              'className={`border-b transition-colors ${',
              1,
          )

          if s == original:
              raise SystemExit('No corrective IVA changes matched')

          required = [
              'relative h-full w-full overflow-auto',
              '<table className="w-full caption-bottom text-sm">',
              'sticky top-0 z-30 bg-slate-600',
              '<tbody className="[&_tr:last-child]:border-0">',
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'Missing marker: {marker}')

          forbidden = [
              'flex h-full min-w-max w-full flex-col',
              'block min-h-0 flex-1 overflow-y-auto',
              'table w-full table-fixed border-b transition-colors',
          ]
          for marker in forbidden:
              if marker in s:
                  raise SystemExit(f'Broken flex-table marker still present: {marker}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify corrected IVA table
        run: |
          grep -q 'relative h-full w-full overflow-auto' src/pages/scadenze/iva.tsx
          grep -q 'sticky top-0 z-30 bg-slate-600' src/pages/scadenze/iva.tsx
          ! grep -q 'flex h-full min-w-max w-full flex-col' src/pages/scadenze/iva.tsx
          ! grep -q 'block min-h-0 flex-1 overflow-y-auto' src/pages/scadenze/iva.tsx

      - name: Commit runtime IVA page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/iva.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Restore IVA table geometry with sticky header'
          git push origin main

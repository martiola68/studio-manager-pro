name: Build SMP Native Android APK + AAB

on:
  push:
    branches: [ android-native-v1 ]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure release signing if available
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SMP_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SMP_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SMP_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SMP_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/smp-release.jks
            echo "SMP_KEYSTORE_PATH=$PWD/app/smp-release.jks" >> "$GITHUB_ENV"
            echo "SMP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SMP_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SMP_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SMP_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SMP_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Build installable APK
        run: gradle --no-daemon assembleDebug

      - name: Build Play Store AAB
        run: gradle --no-daemon bundleRelease

      - name: Build signed release APK when signing is configured
        if: env.SMP_SIGNED_RELEASE == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Collect packages
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Studio-Manager-Pro-v1.18.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/Studio-Manager-Pro-v1.18.aab

          if [ "$SMP_SIGNED_RELEASE" = "true" ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Studio-Manager-Pro-v1.18-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Studio-Manager-Pro-v1.18-release-unsigned.apk
          fi

          printf "Version: 1.18-native\nVersionCode: 18\nPackage: it.studiomanagerpro.mobile\nSigned release configured: %s\n" "$SMP_SIGNED_RELEASE" > dist/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Manager-Pro-Native-v1.18
          path: android-native/dist/*
          if-no-files-found: error

      - name: Publish website APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-native/dist/Studio-Manager-Pro-v1.18.apk Studio-Manager-Pro-Android.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Studio Manager Pro Android" --notes "Download ufficiale dell'app Android Studio Manager Pro."
          gh release upload android-latest Studio-Manager-Pro-Android.apk --clobber

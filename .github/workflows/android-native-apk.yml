name: Build SMP Native Android APK

on:
  push:
    branches: [ android-native-v1 ]
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Studio-Manager-Pro-Native-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Manager-Pro-Native-v1
          path: android-native/Studio-Manager-Pro-Native-v1.apk
          if-no-files-found: error

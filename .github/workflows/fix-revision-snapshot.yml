name: Fix revisione snapshot data v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-revision-snapshot.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch presa in carico snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/revisione-controllo/presa-in-carico.tsx")
          text = path.read_text(encoding="utf-8")

          helper_anchor = '''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });
function nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }
'''
          helper_new = '''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });
function nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }

function parseDataOrgano(value: unknown, fineGiornata = false) {
  if (!value) return null;
  const raw = String(value).trim();
  const italiana = raw.match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/);
  const iso = italiana ? `${italiana[3]}-${italiana[2]}-${italiana[1]}` : raw.slice(0, 10);
  const data = new Date(`${iso}T${fineGiornata ? "23:59:59" : "00:00:00"}`);
  return Number.isNaN(data.getTime()) ? null : data;
}

function organoValidoAllaData(organo: any, dataRiferimento: string) {
  const riferimento = dataRiferimento ? parseDataOrgano(dataRiferimento, true) : new Date();
  if (!riferimento) return true;

  const dalRaw = organo?.data_nomina || organo?.data_inizio || organo?.dal || null;
  const alRaw = organo?.data_cessazione || organo?.data_scadenza || organo?.data_fine || organo?.al || null;
  const dal = parseDataOrgano(dalRaw, false);
  const al = parseDataOrgano(alRaw, true);

  if (dal && dal > riferimento) return false;
  if (al && al < riferimento) return false;

  // Un record cessato resta valido nello snapshot storico fino alla data di fine.
  // Se invece e' disattivato senza alcuna data di fine, non e' considerato vigente.
  if (organo?.attivo === false && !alRaw) return false;

  return true;
}
'''
          if "function organoValidoAllaData" not in text:
            if helper_anchor not in text:
              raise SystemExit("Anchor helper non trovato")
            text = text.replace(helper_anchor, helper_new, 1)

          old_snapshot = '''  async function caricaSnapshot() {
    setLoadingSnapshot(true); setErrore("");
    const supabase = getSupabaseClient() as any;
    const [clienteRes, organiRes] = await Promise.all([supabase.from("tbclienti").select("*").eq("id", clienteId).maybeSingle(), supabase.from("tbclienti_organi").select("*").eq("cliente_id", clienteId).eq("attivo", true)]);
    if (clienteRes.error) { setErrore(clienteRes.error.message); setLoadingSnapshot(false); return; }
    if (organiRes.error) { setErrore(organiRes.error.message); setLoadingSnapshot(false); return; }
    setSnapshot({ acquisito_il: new Date().toISOString(), cliente: clienteRes.data || null, organi_sociali: organiRes.data || [] }); setLoadingSnapshot(false);
  }
'''
          new_snapshot = '''  async function caricaSnapshot() {
    setLoadingSnapshot(true); setErrore("");
    const supabase = getSupabaseClient() as any;
    const [clienteRes, organiRes] = await Promise.all([
      supabase.from("tbclienti").select("*").eq("id", clienteId).maybeSingle(),
      supabase.from("tbclienti_organi").select("*").eq("cliente_id", clienteId),
    ]);
    if (clienteRes.error) { setErrore(clienteRes.error.message); setLoadingSnapshot(false); return; }
    if (organiRes.error) { setErrore(organiRes.error.message); setLoadingSnapshot(false); return; }
    setSnapshot({ acquisito_il: new Date().toISOString(), cliente: clienteRes.data || null, organi_sociali: organiRes.data || [] }); setLoadingSnapshot(false);
  }
'''
          if old_snapshot in text:
            text = text.replace(old_snapshot, new_snapshot, 1)
          elif '.eq("cliente_id", clienteId).eq("attivo", true)' in text:
            text = text.replace('.eq("cliente_id", clienteId).eq("attivo", true)', '.eq("cliente_id", clienteId)', 1)
          elif 'fetch(`/api/clienti-organi?' in text:
            raise SystemExit("Sorgente snapshot inattesa: presente variante API, verificare prima di sovrascrivere")

          old_counts = '''  const soci = (snapshot?.organi_sociali || []).filter((o: any) => o.ruolo === "socio");
  const amministratori = (snapshot?.organi_sociali || []).filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));
  const controllo = (snapshot?.organi_sociali || []).filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));
'''
          new_counts = '''  const organiAllaData = (snapshot?.organi_sociali || []).filter((o: any) => organoValidoAllaData(o, dataBilancio));
  const soci = organiAllaData.filter((o: any) => o.ruolo === "socio");
  const amministratori = organiAllaData.filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));
  const controllo = organiAllaData.filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));
'''
          if old_counts in text:
            text = text.replace(old_counts, new_counts, 1)
          elif "const organiAllaData" not in text:
            raise SystemExit("Blocco conteggi non trovato")

          if '.eq("cliente_id", clienteId).eq("attivo", true)' in text:
            raise SystemExit("Filtro attivo=true ancora presente nello snapshot")
          if "function organoValidoAllaData" not in text or "const organiAllaData" not in text:
            raise SystemExit("Fix storico incompleto")

          path.write_text(text, encoding="utf-8")

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/revisione-controllo/presa-in-carico.tsx
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "fix: revision snapshot uses historical company organs"
          git pull --rebase origin main
          git push origin HEAD:main

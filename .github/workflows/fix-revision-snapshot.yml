name: Fix revisione snapshot data

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-revision-snapshot.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch presa in carico snapshot
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/revisione-controllo/presa-in-carico.tsx")
          text = path.read_text(encoding="utf-8")

          old_helper_anchor = '''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });
function nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }
'''
          new_helper_anchor = '''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });
function nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }

function organoValidoAllaData(organo: any, dataRiferimento: string) {
  const riferimento = dataRiferimento ? new Date(`${dataRiferimento}T23:59:59`) : new Date();
  const inizio = organo?.data_nomina ? new Date(`${organo.data_nomina}T00:00:00`) : null;
  const fineRaw = organo?.data_cessazione || organo?.data_scadenza || null;
  const fine = fineRaw ? new Date(`${fineRaw}T23:59:59`) : null;

  if (inizio && !Number.isNaN(inizio.getTime()) && inizio > riferimento) return false;
  if (fine && !Number.isNaN(fine.getTime()) && fine < riferimento) return false;

  if (organo?.attivo === false && !fineRaw) return false;

  return true;
}
'''
          if old_helper_anchor not in text:
            raise SystemExit("Anchor helper non trovato: nessuna modifica applicata")
          text = text.replace(old_helper_anchor, new_helper_anchor, 1)

          old_snapshot = '''  async function caricaSnapshot() {
    setLoadingSnapshot(true); setErrore("");
    const supabase = getSupabaseClient() as any;
    const [clienteRes, organiRes] = await Promise.all([supabase.from("tbclienti").select("*").eq("id", clienteId).maybeSingle(), supabase.from("tbclienti_organi").select("*").eq("cliente_id", clienteId).eq("attivo", true)]);
    if (clienteRes.error) { setErrore(clienteRes.error.message); setLoadingSnapshot(false); return; }
    if (organiRes.error) { setErrore(organiRes.error.message); setLoadingSnapshot(false); return; }
    setSnapshot({ acquisito_il: new Date().toISOString(), cliente: clienteRes.data || null, organi_sociali: organiRes.data || [] }); setLoadingSnapshot(false);
  }
'''
          new_snapshot = '''  async function caricaSnapshot() {
    setLoadingSnapshot(true); setErrore("");
    const supabase = getSupabaseClient() as any;

    try {
      const [clienteRes, organiResponse] = await Promise.all([
        supabase.from("tbclienti").select("*").eq("id", clienteId).maybeSingle(),
        fetch(`/api/clienti-organi?cliente_id=${encodeURIComponent(clienteId)}`, { cache: "no-store" }),
      ]);

      if (clienteRes.error) throw new Error(clienteRes.error.message);

      const organiPayload = await organiResponse.json();
      if (!organiResponse.ok) throw new Error(organiPayload?.error || "Errore nel caricamento di soci e organi sociali.");

      setSnapshot({
        acquisito_il: new Date().toISOString(),
        cliente: clienteRes.data || null,
        organi_sociali: organiPayload?.organi || [],
      });
    } catch (e: any) {
      setSnapshot(null);
      setErrore(e?.message || "Errore durante l'acquisizione dei dati societari.");
    } finally {
      setLoadingSnapshot(false);
    }
  }
'''
          if old_snapshot not in text:
            raise SystemExit("Blocco caricaSnapshot non trovato: nessuna modifica applicata")
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_counts = '''  const soci = (snapshot?.organi_sociali || []).filter((o: any) => o.ruolo === "socio");
  const amministratori = (snapshot?.organi_sociali || []).filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));
  const controllo = (snapshot?.organi_sociali || []).filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));
'''
          new_counts = '''  const organiAllaData = (snapshot?.organi_sociali || []).filter((o: any) => organoValidoAllaData(o, dataBilancio));
  const soci = organiAllaData.filter((o: any) => o.ruolo === "socio");
  const amministratori = organiAllaData.filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));
  const controllo = organiAllaData.filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));
'''
          if old_counts not in text:
            raise SystemExit("Blocco conteggi non trovato: nessuna modifica applicata")
          text = text.replace(old_counts, new_counts, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/revisione-controllo/presa-in-carico.tsx
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "fix: load revisione snapshot from organi API"
          git push origin main


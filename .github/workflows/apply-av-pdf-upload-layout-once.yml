name: Apply AV PDF upload and layout patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-av-pdf-upload-layout-once.yml
      - scripts/patch-av-pdf-upload-layout-once.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted AV patch with diagnostics
        shell: bash
        run: |
          set +e
          node scripts/patch-av-pdf-upload-layout-once.mjs > av-patch-run.log 2>&1
          code=$?
          cat av-patch-run.log
          echo "exit_code=$code" >> av-patch-run.log
          exit 0

      - name: Commit diagnostic and runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add av-patch-run.log src/pages/antiriciclaggio/modello-av1.tsx src/pages/antiriciclaggio/modello-av4.tsx
          git commit -m "diagnose AV patch runtime" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Apply AV PDF upload and layout patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-av-pdf-upload-layout-once.yml
      - scripts/patch-av-pdf-upload-layout-once.mjs
      - scripts/patch-fascicolo-signed-read-once.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fascicolo signed read patch
        run: node scripts/patch-fascicolo-signed-read-once.mjs

      - name: Verify fascicolo signed read patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/antiriciclaggio/fascicolo-documenti/signed-url' src/pages/antiriciclaggio/fascicolo-documenti.tsx
          grep -q 'Authorization:' src/pages/antiriciclaggio/fascicolo-documenti.tsx
          test -f src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts
          grep -q 'supabaseAdmin.auth.getUser' src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts

      - name: Commit fascicolo runtime file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/antiriciclaggio/fascicolo-documenti.tsx
          if git diff --cached --quiet; then
            echo "No fascicolo runtime changes to commit"
            exit 0
          fi
          git commit -m "Fix fascicolo document opening via authenticated signed URL"
          git pull --rebase origin main
          git push origin HEAD:main

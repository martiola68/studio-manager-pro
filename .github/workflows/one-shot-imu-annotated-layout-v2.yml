name: One shot - IMU annotated layout v2
on:
  push:
    paths: ['.github/workflows/one-shot-imu-annotated-layout-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch IMU runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/pages/scadenze/imu.tsx')
          s=p.read_text(encoding='utf-8')
          original=s

          # Stato temporaneo per comunicato SI senza data.
          state_marker='  const [localNotes, setLocalNotes] = useState<Record<string, string>>({});\n'
          if state_marker not in s: raise SystemExit('state marker missing')
          if 'pendingComunicato' not in s:
              s=s.replace(state_marker,'  const [pendingComunicato, setPendingComunicato] = useState<{ id: string; tipo: "acconto" | "saldo" } | null>(null);\n\n'+state_marker,1)

          # Helper colori: grigio / arancio / verde. Conferma riga resta verde come prima.
          m=re.search(r'  const sectionTone = \([\s\S]*?  const rowSideTone = \(rowConfirmed: boolean\) =>\n    rowConfirmed \? "bg-green-200" : "bg-slate-50";',s)
          if not m: raise SystemExit('section helper missing')
          helpers='''  const sectionColor = (\n    soggetto: boolean | null | undefined,\n    dovuto: boolean | null | undefined,\n    comunicato: boolean | null | undefined,\n    rowConfirmed: boolean\n  ) => {\n    if (rowConfirmed) return "#bbf7d0";\n    if (!soggetto || !dovuto) return "#e2e8f0";\n    if (comunicato) return "#bbf7d0";\n    return "#fdba74";\n  };\n\n  const subjectColor = (soggetto: boolean | null | undefined, rowConfirmed: boolean) =>\n    rowConfirmed ? "#bbf7d0" : soggetto ? "#fdba74" : "#e2e8f0";\n\n  const declarationColor = (\n    soggetto: boolean | null | undefined,\n    prevista: boolean | null | undefined,\n    presentata: boolean | null | undefined,\n    rowConfirmed: boolean\n  ) => {\n    if (rowConfirmed) return "#bbf7d0";\n    if (!soggetto || !prevista) return "#e2e8f0";\n    if (presentata) return "#bbf7d0";\n    return "#fdba74";\n  };\n\n  const rowSideTone = (rowConfirmed: boolean) =>\n    rowConfirmed ? "bg-green-200" : "bg-slate-50";'''
          s=s[:m.start()]+helpers+s[m.end():]

          # Handler specifici. NON modifica handleToggleField / conferma_riga.
          handler_marker='  const handleNoteChange = (scadenzaId: string, value: string) => {\n'
          if handler_marker not in s: raise SystemExit('handler marker missing')
          if 'handleSoggettoImuChange' not in s:
              handlers='''  const handleSoggettoImuChange = async (scadenza: ScadenzaImu, value: boolean) => {\n    try {\n      const payload = { acconto_imu: value, saldo_imu: value };\n      const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (error) throw error;\n      setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, ...payload } : r));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n  const handleComunicatoChange = (scadenza: ScadenzaImu, tipo: "acconto" | "saldo", value: boolean) => {\n    const dovuto = tipo === "acconto" ? scadenza.acconto_dovuto : scadenza.saldo_dovuto;\n    if (!dovuto) return;\n    const data = tipo === "acconto" ? scadenza.data_com_acconto : scadenza.data_com_saldo;\n    const comunicatoField = tipo === "acconto" ? "acconto_comunicato" : "saldo_comunicato";\n    const confermaField = tipo === "acconto" ? "conferma_acconto_imu" : "conferma_saldo_imu";\n\n    if (value && !data) {\n      setPendingComunicato({ id: scadenza.id, tipo });\n      toast({ title: "Data comunicazione obbligatoria", description: "Inserisci la data di comunicazione prima di completare la sezione.", variant: "destructive" });\n      setTimeout(() => document.getElementById(`imu-${tipo}-data-${scadenza.id}`)?.focus(), 0);\n      return;\n    }\n\n    void supabase.from("tbscadimu").update({ [comunicatoField]: value, [confermaField]: value }).eq("id", scadenza.id).then(({ error }) => {\n      if (error) {\n        toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n        void loadScadenze();\n        return;\n      }\n      setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, [comunicatoField]: value, [confermaField]: value } : r));\n      if (!value) setPendingComunicato(null);\n    });\n  };\n\n  const handleCommunicationDateChange = async (scadenza: ScadenzaImu, tipo: "acconto" | "saldo", value: string) => {\n    const dataField = tipo === "acconto" ? "data_com_acconto" : "data_com_saldo";\n    await handleUpdateField(scadenza.id, dataField, value);\n    if (value && pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === tipo) {\n      const comunicatoField = tipo === "acconto" ? "acconto_comunicato" : "saldo_comunicato";\n      const confermaField = tipo === "acconto" ? "conferma_acconto_imu" : "conferma_saldo_imu";\n      const { error } = await supabase.from("tbscadimu").update({ [comunicatoField]: true, [confermaField]: true }).eq("id", scadenza.id);\n      if (!error) {\n        setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, [dataField]: value, [comunicatoField]: true, [confermaField]: true } : r));\n        setPendingComunicato(null);\n      }\n    }\n  };\n\n  const handleDichiarazioneImuChange = async (scadenza: ScadenzaImu, value: boolean) => {\n    try {\n      if (!value) {\n        const payload = { dichiarazione_imu: false, data_scad_dichiarazione: null, dichiarazione_presentata: false, conferma_dichiarazione_imu: false };\n        const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n        if (error) throw error;\n        setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, ...payload } : r));\n        return;\n      }\n\n      const annoBase = scadenza.anno_riferimento ?? Number(filterAnno);\n      const annoScadenza = annoBase + 1;\n      const { data, error } = await supabase.from("tbtipi_scadenze")\n        .select("data_scadenza,nome")\n        .eq("tipo_scadenza", "imu")\n        .ilike("nome", "%dichiarazione%")\n        .gte("data_scadenza", `${annoScadenza}-01-01`)\n        .lte("data_scadenza", `${annoScadenza}-12-31`)\n        .order("data_scadenza", { ascending: true })\n        .limit(1)\n        .maybeSingle();\n      if (error) throw error;\n      if (!data?.data_scadenza) {\n        toast({ title: "Scadenza Dichiarazione IMU non configurata", description: `Manca la scadenza IMU dichiarazione per ${annoScadenza}.`, variant: "destructive" });\n        return;\n      }\n      const payload = { dichiarazione_imu: true, data_scad_dichiarazione: data.data_scadenza };\n      const { error: updateError } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (updateError) throw updateError;\n      setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, ...payload } : r));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n  const handleDichiarazionePresentataChange = async (scadenza: ScadenzaImu, value: boolean) => {\n    try {\n      const payload = { dichiarazione_presentata: value, conferma_dichiarazione_imu: value };\n      const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (error) throw error;\n      setScadenze(prev => prev.map(r => r.id === scadenza.id ? { ...r, ...payload } : r));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n'''
              s=s.replace(handler_marker,handlers+handler_marker,1)

          # Header esatto richiesto.
          hs=s.find('    <th className={`${baseHeaderClass} min-w-[120px]`}>Acconto IMU</th>')
          he=s.find('    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[300px]',hs)
          if hs<0 or he<0: raise SystemExit('header block missing')
          header='''    <th className={`${baseHeaderClass} min-w-[120px]`}>Soggetto IMU</th>\n    <th className={`${baseHeaderClass} min-w-[120px] print-hide`}>Dovuto</th>\n    <th className={`${baseHeaderClass} min-w-[120px]`}>Comunicato</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[160px] border-r border-slate-500 bg-slate-600 print-hide">Data comunicazione</th>\n    <th className={`${baseHeaderClass} min-w-[140px] print-hide`}>Con dic. IMU</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[170px] border-r border-slate-500 bg-slate-600 print-hide">Data scadenza dic.</th>\n    <th className={`${baseHeaderClass} min-w-[140px] print-hide`}>Dic. presentata</th>\n    <th className={`${baseHeaderClass} min-w-[120px] print-hide`}>Dovuto</th>\n    <th className={`${baseHeaderClass} min-w-[120px]`}>Comunicato</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[160px] border-r border-slate-500 bg-slate-600 print-hide">Data comunicazione</th>\n'''
          s=s[:hs]+header+s[he:]
          s=s.replace('colSpan={17}','colSpan={16}',1)

          # Sostituisce il blocco centrale delle celle con ordine: Soggetto -> Acconto -> Dichiarazione -> Saldo.
          bs=s.find('          <td className={`${baseCellClass} text-center min-w-[120px] ${sectionTone(scadenza.acconto_imu')
          be=s.find('          <td className={`${baseCellClass} min-w-[300px] print-hide',bs)
          if bs<0 or be<0: raise SystemExit('body block missing')
          sel='h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400'
          inp='h-8 w-full border-slate-300 bg-white text-xs disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400'
          body=f'''          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{backgroundColor:subjectColor(scadenza.acconto_imu,isGreenRow)}}}}><select value={{scadenza.acconto_imu?"SI":"NO"}} onChange={{e=>void handleSoggettoImuChange(scadenza,e.target.value==="SI")}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px] print-hide" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.acconto_dovuto,scadenza.acconto_comunicato,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu}} value={{scadenza.acconto_dovuto?"SI":"NO"}} onChange={{e=>{{const v=e.target.value==="SI";if(v!==Boolean(scadenza.acconto_dovuto))handleToggleField(scadenza.id,"acconto_dovuto",scadenza.acconto_dovuto)}}}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.acconto_dovuto,scadenza.acconto_comunicato,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu||!scadenza.acconto_dovuto}} value={{pendingComunicato?.id===scadenza.id&&pendingComunicato.tipo==="acconto"?"SI":scadenza.acconto_comunicato?"SI":"NO"}} onChange={{e=>handleComunicatoChange(scadenza,"acconto",e.target.value==="SI")}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} min-w-[160px] print-hide" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.acconto_dovuto,scadenza.acconto_comunicato||pendingComunicato?.id===scadenza.id&&pendingComunicato.tipo==="acconto",isGreenRow)}}}}><Input id={{`imu-acconto-data-${{scadenza.id}}`}} type="date" disabled={{!scadenza.acconto_imu||!scadenza.acconto_dovuto}} value={{scadenza.data_com_acconto||""}} onChange={{e=>void handleCommunicationDateChange(scadenza,"acconto",e.target.value)}} className="{inp}" /></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[140px] print-hide" style={{{{backgroundColor:declarationColor(scadenza.acconto_imu,scadenza.dichiarazione_imu,scadenza.dichiarazione_presentata,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu}} value={{scadenza.dichiarazione_imu?"SI":"NO"}} onChange={{e=>void handleDichiarazioneImuChange(scadenza,e.target.value==="SI")}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} min-w-[170px] print-hide" style={{{{backgroundColor:declarationColor(scadenza.acconto_imu,scadenza.dichiarazione_imu,scadenza.dichiarazione_presentata,isGreenRow)}}}}><Input type="date" disabled value={{scadenza.data_scad_dichiarazione||""}} className="{inp}" /></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[140px] print-hide" style={{{{backgroundColor:declarationColor(scadenza.acconto_imu,scadenza.dichiarazione_imu,scadenza.dichiarazione_presentata,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu||!scadenza.dichiarazione_imu}} value={{scadenza.dichiarazione_presentata?"SI":"NO"}} onChange={{e=>void handleDichiarazionePresentataChange(scadenza,e.target.value==="SI")}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px] print-hide" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.saldo_dovuto,scadenza.saldo_comunicato,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu}} value={{scadenza.saldo_dovuto?"SI":"NO"}} onChange={{e=>{{const v=e.target.value==="SI";if(v!==Boolean(scadenza.saldo_dovuto))handleToggleField(scadenza.id,"saldo_dovuto",scadenza.saldo_dovuto)}}}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.saldo_dovuto,scadenza.saldo_comunicato,isGreenRow)}}}}><select disabled={{!scadenza.acconto_imu||!scadenza.saldo_dovuto}} value={{pendingComunicato?.id===scadenza.id&&pendingComunicato.tipo==="saldo"?"SI":scadenza.saldo_comunicato?"SI":"NO"}} onChange={{e=>handleComunicatoChange(scadenza,"saldo",e.target.value==="SI")}} className="{sel}"><option value="NO">NO</option><option value="SI">SI</option></select></td>\n\n          <td className="${{baseCellClass}} min-w-[160px] print-hide" style={{{{backgroundColor:sectionColor(scadenza.acconto_imu,scadenza.saldo_dovuto,scadenza.saldo_comunicato||pendingComunicato?.id===scadenza.id&&pendingComunicato.tipo==="saldo",isGreenRow)}}}}><Input id={{`imu-saldo-data-${{scadenza.id}}`}} type="date" disabled={{!scadenza.acconto_imu||!scadenza.saldo_dovuto}} value={{scadenza.data_com_saldo||""}} onChange={{e=>void handleCommunicationDateChange(scadenza,"saldo",e.target.value)}} className="{inp}" /></td>\n\n'''
          s=s[:bs]+body+s[be:]

          s=s.replace('<th>Acconto IMU</th>','<th>Soggetto IMU</th>',1)

          for x in ['>Soggetto IMU</th>','handleSoggettoImuChange','handleDichiarazioneImuChange','.from("tbtipi_scadenze")','value={scadenza.conferma_riga ? "SI" : "NO"}']:
              if x not in s: raise SystemExit('missing '+x)
          if '>Saldo IMU</th>' in s: raise SystemExit('Saldo IMU header still present')
          if s==original: raise SystemExit('no changes')

          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/imu.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'Apply exact annotated IMU layout v2'
          git push origin main

name: Apply Soci e Organi visible fixes once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-organi-visible-fixes-once.yml

permissions:
  contents: write

jobs:
  patch-build-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('src/pages/clienti/organi-sociali.tsx')
          text = page.read_text(encoding='utf-8')
          original = text

          def once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label}: marker not found')
              text = text.replace(old, new, 1)

          # CF: stesso comportamento dei rappresentanti legali.
          once(
          '''async function leggiDatiDaCF(\n  cf: string,\n  setNuovoNominativo: any\n) {\n  // ...\n}\n''',
          '''async function leggiDatiDaCF(\n  cf: string,\n  setNuovoNominativo: any\n) {\n  const normalized = normalizeCF(cf);\n  if (normalized.length !== 16 || !isValidCF(normalized)) return;\n\n  try {\n    const comuneData = await getComuneFromCF(normalized);\n    const dataNascita = extractDataNascitaFromCF(normalized);\n\n    setNuovoNominativo((prev: any) => ({\n      ...prev,\n      luogo_nascita: comuneData?.comune || prev.luogo_nascita || \"\",\n      data_nascita: dataNascita || prev.data_nascita || \"\",\n    }));\n  } catch (error) {\n    console.error(\"Errore lettura dati anagrafici dal codice fiscale:\", error);\n  }\n}\n''', 'CF helper')

          # Stato iniziale e reset form: quota nominale.
          text = text.replace(
              '  percentuale_partecipazione: \"\",\n  titolo_possesso: \"piena_proprieta\",',
              '  percentuale_partecipazione: \"\",\n  importo_quota_nominale: \"\",\n  titolo_possesso: \"piena_proprieta\",'
          )
          text = text.replace(
              'carica: \"\", percentuale_partecipazione: \"\", titolo_possesso: \"piena_proprieta\",',
              'carica: \"\", percentuale_partecipazione: \"\", importo_quota_nominale: \"\", titolo_possesso: \"piena_proprieta\",'
          )
          text = text.replace(
              '  percentuale_partecipazione: \"\",\n  presenza: \"Presente\",',
              '  percentuale_partecipazione: \"\",\n  importo_quota_nominale: \"\",\n  presenza: \"Presente\",'
          )

          # Salvataggio payload.
          once(
          '''  percentuale_partecipazione:\n    form.ruolo === \"socio\"\n      ? form.percentuale_partecipazione || null\n      : null,\n  titolo_possesso:''',
          '''  percentuale_partecipazione:\n    form.ruolo === \"socio\"\n      ? form.percentuale_partecipazione || null\n      : null,\n  importo_quota_nominale:\n    form.ruolo === \"socio\"\n      ? form.importo_quota_nominale || null\n      : null,\n  titolo_possesso:''', 'payload nominale')

          # Caricamento in modifica.
          once(
          '''    percentuale_partecipazione:\n      organo.percentuale_partecipazione\n        ? String(organo.percentuale_partecipazione)\n        : \"\",\n    presenza:''',
          '''    percentuale_partecipazione:\n      organo.percentuale_partecipazione\n        ? String(organo.percentuale_partecipazione)\n        : \"\",\n    importo_quota_nominale:\n      organo.importo_quota_nominale != null\n        ? String(organo.importo_quota_nominale)\n        : \"\",\n    presenza:''', 'edit nominale')

          # Tabella soci: quota nominale prima degli utili.
          once(
              '<th style={thStyle}>Voto</th><th style={thStyle}>Utili</th>',
              '<th style={thStyle}>Voto</th><th style={thStyle}>Quota nominale</th><th style={thStyle}>Utili</th>',
              'header tabella soci'
          )
          once(
              '<td style={tdStyle}>{o.percentuale_diritti_voto != null ? `${Number(o.percentuale_diritti_voto).toFixed(2)}%` : \"—\"}</td><td style={tdStyle}>{o.percentuale_diritti_utili != null ?',
              '<td style={tdStyle}>{o.percentuale_diritti_voto != null ? `${Number(o.percentuale_diritti_voto).toFixed(2)}%` : \"—\"}</td><td style={tdStyle}>{o.importo_quota_nominale != null ? Number(o.importo_quota_nominale).toLocaleString(\"it-IT\", { style: \"currency\", currency: \"EUR\" }) : \"—\"}</td><td style={tdStyle}>{o.percentuale_diritti_utili != null ?',
              'body tabella soci'
          )
          text = text.replace('colSpan={9}>Nessun socio presente.', 'colSpan={10}>Nessun socio presente.', 1)

          # Sostituisce i tre blocchi specifici dei modali con layout chiaro.
          pattern = re.compile(r'\{modalSezione===\"soci\" \? <>.*?</> : modalSezione===\"amministrazione\" \? <>.*?</> : <>.*?</>\}', re.S)
          replacement = '''{modalSezione === "soci" ? (\n    <>\n      <div style={{ marginTop: 18, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>\n        <div><label style={labelStyle}>Tipo</label><input style={{ ...inputStyle, background: "#f1f5f9" }} value="Socio" disabled /></div>\n        <div><label style={labelStyle}>Dal</label><input type="date" style={inputStyle} value={form.data_nomina} onChange={(e) => setForm((p) => ({ ...p, data_nomina: e.target.value }))} /></div>\n        <div><label style={labelStyle}>Al</label><input type="date" style={inputStyle} value={form.data_scadenza} onChange={(e) => setForm((p) => ({ ...p, data_scadenza: e.target.value }))} /></div>\n      </div>\n      <div style={{ marginTop: 16, padding: 16, border: "1.5px solid #bfdbfe", borderRadius: 10, background: "#f8fbff" }}>\n        <div style={{ display: "grid", gridTemplateColumns: "1.2fr .7fr .7fr", gap: 12 }}>\n          <div><label style={labelStyle}>Tipologia del diritto</label><select style={inputStyle} value={form.titolo_possesso} onChange={(e) => setForm((p) => ({ ...p, titolo_possesso: e.target.value }))}><option value="piena_proprieta">Piena proprietà</option><option value="usufrutto">Usufrutto</option><option value="nuda_proprieta">Nuda proprietà</option><option value="pegno">Pegno</option><option value="sequestro">Sequestro</option><option value="intestazione_fiduciaria">Intestazione fiduciaria</option><option value="altro">Altro</option></select></div>\n          <div><label style={labelStyle}>Quota %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_partecipazione} onChange={(e) => { const v = e.target.value; setForm((p) => ({ ...p, percentuale_partecipazione: v, percentuale_diritti_voto: p.titolo_possesso === "piena_proprieta" ? v : p.percentuale_diritti_voto, percentuale_diritti_utili: p.titolo_possesso === "piena_proprieta" ? v : p.percentuale_diritti_utili })); }} /></div>\n          <div><label style={labelStyle}>Diritti di voto %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_diritti_voto} onChange={(e) => setForm((p) => ({ ...p, percentuale_diritti_voto: e.target.value }))} /></div>\n        </div>\n        <div style={{ display: "grid", gridTemplateColumns: "1fr .55fr", gap: 12, marginTop: 12 }}>\n          <div><label style={labelStyle}>Importo quota capitale posseduta (nominale)</label><input type="number" min="0" step="0.01" style={inputStyle} value={form.importo_quota_nominale} onChange={(e) => setForm((p) => ({ ...p, importo_quota_nominale: e.target.value }))} /></div>\n          <div><label style={labelStyle}>Partecipazione agli utili %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_diritti_utili} onChange={(e) => setForm((p) => ({ ...p, percentuale_diritti_utili: e.target.value }))} /></div>\n        </div>\n      </div>\n    </>\n  ) : modalSezione === "amministrazione" ? (\n    <div style={{ marginTop: 18, display: "grid", gridTemplateColumns: "1.1fr 1fr 1fr .8fr auto", gap: 12, alignItems: "end" }}>\n      <div><label style={labelStyle}>Qualifica</label><select style={inputStyle} value={form.ruolo} onChange={(e) => setForm((p) => ({ ...p, ruolo: e.target.value }))}>{ruoliAmministrazione.map((r) => <option key={r} value={r}>{ruoliLabel[r] || r}</option>)}</select></div>\n      <div><label style={labelStyle}>Data nomina</label><input type="date" style={inputStyle} value={form.data_nomina} onChange={(e) => setForm((p) => ({ ...p, data_nomina: e.target.value }))} /></div>\n      <div><label style={labelStyle}>Data revoca / dimissioni</label><input type="date" style={inputStyle} value={form.data_cessazione} onChange={(e) => setForm((p) => ({ ...p, data_cessazione: e.target.value }))} /></div>\n      <div><label style={labelStyle}>Scadenza</label><select style={inputStyle} value={form.durata_carica === "Indeterminato" ? "Indeterminato" : "A revoca"} onChange={(e) => setForm((p) => ({ ...p, durata_carica: e.target.value === "Indeterminato" ? "Indeterminato" : "Fino a revoca", data_scadenza: "" }))}><option value="A revoca">A revoca</option><option value="Indeterminato">Indeterminato</option></select></div>\n      <label style={{ display: "flex", alignItems: "center", gap: 8, minHeight: 42, paddingBottom: 2, whiteSpace: "nowrap" }}><input type="checkbox" checked={form.principale} onChange={(e) => setForm((p) => ({ ...p, principale: e.target.checked }))} /> Firmatario</label>\n    </div>\n  ) : (\n    <div style={{ marginTop: 18, display: "grid", gridTemplateColumns: "1.2fr 1fr 1fr", gap: 12 }}>\n      <div><label style={labelStyle}>Qualifica</label><select style={inputStyle} value={form.ruolo} onChange={(e) => setForm((p) => ({ ...p, ruolo: e.target.value }))}>{ruoliControllo.map((r) => <option key={r} value={r}>{ruoliLabel[r] || r}</option>)}</select></div>\n      <div><label style={labelStyle}>Data nomina</label><input type="date" style={inputStyle} value={form.data_nomina} onChange={(e) => setForm((p) => ({ ...p, data_nomina: e.target.value }))} /></div>\n      <div><label style={labelStyle}>Data cessazione</label><input type="date" style={inputStyle} value={form.data_cessazione} onChange={(e) => setForm((p) => ({ ...p, data_cessazione: e.target.value }))} /></div>\n    </div>\n  )}'''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'modal section replacement count={n}')

          # Nuovo nominativo: label sopra i campi.
          modal_start = text.index('{showNuovoNominativo && (')
          grid_marker = '''            <div\n              style={{\n                display: "grid",\n                gridTemplateColumns: "1fr 1fr",\n                gap: 10,\n                marginTop: 15,\n              }}\n            >'''
          start = text.index(grid_marker, modal_start)
          action_marker = '''\n\n<div\n  style={{\n    display: "flex",\n    justifyContent: "flex-end",'''
          end = text.index(action_marker, start)
          new_grid = '''            <div\n              style={{\n                display: "grid",\n                gridTemplateColumns: "1fr 1fr",\n                gap: 12,\n                marginTop: 15,\n              }}\n            >\n              <div><label style={labelStyle}>Cognome e nome</label><input style={inputStyle} value={nuovoNominativo.nome_cognome} onChange={(e) => setNuovoNominativo((p) => ({ ...p, nome_cognome: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Tipologia</label><select style={inputStyle} value={nuovoNominativo.tipologia_cliente} onChange={(e) => { const tipologia = e.target.value; setNuovoNominativo((p) => ({ ...p, tipologia_cliente: tipologia, luogo_nascita: tipologia === "Persona fisica" ? p.luogo_nascita : "", data_nascita: tipologia === "Persona fisica" ? p.data_nascita : "" })); }}><option value="Persona fisica">Persona fisica</option><option value="Altro">Società / ente</option></select></div>\n              <div>\n                <label style={labelStyle}>{nuovoNominativo.tipologia_cliente === "Persona fisica" ? "Codice fiscale" : "Codice fiscale società / ente"}</label>\n                <input style={{ ...inputStyle, borderColor: nuovoNominativo.codice_fiscale && !isCodiceFiscaleNominativoValido() ? "#dc2626" : "#94a3b8" }} maxLength={nuovoNominativo.tipologia_cliente === "Persona fisica" ? 16 : 11} value={nuovoNominativo.codice_fiscale} onChange={async (e) => { const cf = normalizeCF(e.target.value); setNuovoNominativo((p) => ({ ...p, codice_fiscale: cf })); if (nuovoNominativo.tipologia_cliente === "Persona fisica" && cf.length === 16 && isValidCF(cf)) await leggiDatiDaCF(cf, setNuovoNominativo); }} />\n                {nuovoNominativo.codice_fiscale && !isCodiceFiscaleNominativoValido() && <div style={{ marginTop: 4, color: "#dc2626", fontSize: 12 }}>{nuovoNominativo.tipologia_cliente === "Persona fisica" ? "Codice fiscale della persona fisica non valido" : "Il codice fiscale della società o ente deve essere composto da 11 cifre"}</div>}\n              </div>\n              <div><label style={labelStyle}>Email</label><input style={inputStyle} value={nuovoNominativo.email} onChange={(e) => setNuovoNominativo((p) => ({ ...p, email: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Luogo di nascita</label><input style={{ ...inputStyle, background: nuovoNominativo.tipologia_cliente === "Persona fisica" ? "#fff" : "#f1f5f9" }} disabled={nuovoNominativo.tipologia_cliente !== "Persona fisica"} value={nuovoNominativo.luogo_nascita} onChange={(e) => setNuovoNominativo((p) => ({ ...p, luogo_nascita: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Data di nascita</label><input type="date" style={{ ...inputStyle, background: nuovoNominativo.tipologia_cliente === "Persona fisica" ? "#fff" : "#f1f5f9" }} disabled={nuovoNominativo.tipologia_cliente !== "Persona fisica"} value={nuovoNominativo.data_nascita} onChange={(e) => setNuovoNominativo((p) => ({ ...p, data_nascita: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Indirizzo</label><input style={inputStyle} value={nuovoNominativo.indirizzo} onChange={(e) => setNuovoNominativo((p) => ({ ...p, indirizzo: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Città</label><input style={inputStyle} value={nuovoNominativo.citta} onChange={(e) => setNuovoNominativo((p) => ({ ...p, citta: e.target.value }))} /></div>\n              <div><label style={labelStyle}>Provincia</label><input style={inputStyle} maxLength={2} value={nuovoNominativo.provincia} onChange={(e) => setNuovoNominativo((p) => ({ ...p, provincia: e.target.value.toUpperCase().slice(0, 2) }))} /></div>\n              <div><label style={labelStyle}>CAP</label><input style={inputStyle} maxLength={5} value={nuovoNominativo.cap} onChange={(e) => setNuovoNominativo((p) => ({ ...p, cap: e.target.value.replace(/\\D/g, "").slice(0, 5) }))} /></div>\n            </div>'''
          text = text[:start] + new_grid + text[end:]

          # Bordi ben visibili in tutti i modali/form.
          once(
              '  border: "1px solid #d1d5db",\n  borderRadius: 8,',
              '  border: "1.5px solid #94a3b8",\n  boxShadow: "inset 0 0 0 1px rgba(148,163,184,0.10)",\n  borderRadius: 8,',
              'input borders'
          )

          if text == original:
              raise SystemExit('no changes applied')
          page.write_text(text, encoding='utf-8')

          # API clienti-organi.
          api = Path('src/app/api/clienti-organi/route.ts')
          s = api.read_text(encoding='utf-8')
          s0 = s
          s = s.replace('percentuale_partecipazione,\ntitolo_possesso,', 'percentuale_partecipazione,\nimporto_quota_nominale,\ntitolo_possesso,', 1)

          post_marker = '''percentuale_partecipazione:\n  payload.ruolo === "socio"\n    ? payload.percentuale_partecipazione || null\n    : null,\n\ntitolo_possesso:'''
          post_repl = '''percentuale_partecipazione:\n  payload.ruolo === "socio"\n    ? payload.percentuale_partecipazione || null\n    : null,\n\nimporto_quota_nominale:\n  payload.ruolo === "socio" &&\n  payload.importo_quota_nominale !== "" &&\n  payload.importo_quota_nominale !== undefined\n    ? payload.importo_quota_nominale\n    : null,\n\ntitolo_possesso:'''
          if post_marker not in s: raise SystemExit('API POST marker missing')
          s = s.replace(post_marker, post_repl, 1)

          put_marker = '''    percentuale_partecipazione:\n      payload.ruolo === "socio"\n        ? payload.percentuale_partecipazione || null\n        : null,\n\n    titolo_possesso:'''
          put_repl = '''    percentuale_partecipazione:\n      payload.ruolo === "socio"\n        ? payload.percentuale_partecipazione || null\n        : null,\n\n    importo_quota_nominale:\n      payload.ruolo === "socio" &&\n      payload.importo_quota_nominale !== "" &&\n      payload.importo_quota_nominale !== undefined\n        ? payload.importo_quota_nominale\n        : null,\n\n    titolo_possesso:'''
          if put_marker not in s: raise SystemExit('API PUT marker missing')
          s = s.replace(put_marker, put_repl, 1)
          if s == s0: raise SystemExit('API unchanged')
          api.write_text(s, encoding='utf-8')

          # Migrazione DB.
          mig = Path('supabase/migrations/20260911153000_add_importo_quota_nominale_organi.sql')
          mig.write_text('''alter table if exists public.tbclienti_organi\n  add column if not exists importo_quota_nominale numeric(15,2);\n\ncomment on column public.tbclienti_organi.importo_quota_nominale\n  is 'Importo nominale della quota di capitale posseduta dal socio';\n''', encoding='utf-8')

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx src/app/api/clienti-organi/route.ts supabase/migrations/20260911153000_add_importo_quota_nominale_organi.sql
          git commit -m "Fix Soci e Organi forms and nominal share"
          git push origin main

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ngeltlygytupgdjiagve --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

name: One-shot cassetti fiscali add three rows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[cassetti-three-more-rows]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase table height by about three rows
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/pages/cassetti-fiscali/index.tsx')
          s = p.read_text()

          old = '<div className="relative w-full overflow-auto h-[calc(100vh-340px)] min-h-[420px] max-h-[650px]">'
          new = '<div className="relative w-full overflow-auto h-[calc(100vh-220px)] min-h-[540px] max-h-[780px]">'

          if s.count(old) != 1:
              raise SystemExit(f'Contenitore altezza: atteso 1, trovato {s.count(old)}')

          s = s.replace(old, new)

          if 'export default function CassettiFiscaliPage()' not in s:
              raise SystemExit('Modulo non valido: annullo')

          p.write_text(s)
          Path('.github/workflows/one-shot-cassetti-add-three-rows.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/cassetti-fiscali/index.tsx .github/workflows/one-shot-cassetti-add-three-rows.yml
          git commit -m "style: mostra tre righe in piu nei cassetti fiscali [cassetti-three-more-rows]"
          git push origin main

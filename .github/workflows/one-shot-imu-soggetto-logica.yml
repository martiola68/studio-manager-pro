name: One shot - IMU soggetto e sezioni
on:
  push:
    paths: ['.github/workflows/one-shot-imu-soggetto-logica.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Applica struttura IMU annotata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/pages/scadenze/imu.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # Stato temporaneo: Comunicato=SI non viene salvato finché manca la data.
          marker = '  const [localNotes, setLocalNotes] = useState<Record<string, string>>({});\n'
          if marker not in s:
            raise SystemExit('marker localNotes non trovato')
          if 'pendingComunicato' not in s:
            s = s.replace(marker, '  const [pendingComunicato, setPendingComunicato] = useState<{ id: string; tipo: "acconto" | "saldo" } | null>(null);\n\n' + marker, 1)

          # Sostituisce i vecchi helper colore con la logica esatta del disegno.
          helper_rx = re.compile(r'''  const sectionTone = \([\s\S]*?  const rowSideTone = \(rowConfirmed: boolean\) =>\n    rowConfirmed \? "bg-green-200" : "bg-slate-50";''')
          helper_new = '''  const sectionColor = (\n    soggettoImu: boolean | null | undefined,\n    dovuto: boolean | null | undefined,\n    comunicato: boolean | null | undefined,\n    rowConfirmed: boolean\n  ) => {\n    if (rowConfirmed) return "#bbf7d0";\n    if (!soggettoImu || !dovuto) return "#e2e8f0";\n    if (comunicato) return "#bbf7d0";\n    return "#fdba74";\n  };\n\n  const subjectColor = (soggettoImu: boolean | null | undefined, rowConfirmed: boolean) => {\n    if (rowConfirmed) return "#bbf7d0";\n    return soggettoImu ? "#fdba74" : "#e2e8f0";\n  };\n\n  const declarationColor = (\n    soggettoImu: boolean | null | undefined,\n    prevista: boolean | null | undefined,\n    presentata: boolean | null | undefined,\n    rowConfirmed: boolean\n  ) => {\n    if (rowConfirmed) return "#bbf7d0";\n    if (!soggettoImu || !prevista) return "#e2e8f0";\n    if (presentata) return "#bbf7d0";\n    return "#fdba74";\n  };\n\n  const rowSideTone = (rowConfirmed: boolean) =>\n    rowConfirmed ? "bg-green-200" : "bg-slate-50";'''
          s, n = helper_rx.subn(helper_new, s, count=1)
          if n != 1:
            raise SystemExit('helper sectionTone non trovato')

          # Handler specifici IMU. Conferma riga NON viene modificata.
          insert_marker = '  const handleNoteChange = (scadenzaId: string, value: string) => {\n'
          if insert_marker not in s:
            raise SystemExit('marker handleNoteChange non trovato')
          handlers = '''  const handleSoggettoImuChange = async (scadenza: ScadenzaImu, nextValue: boolean) => {\n    try {\n      const payload = { acconto_imu: nextValue, saldo_imu: nextValue };\n      const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (error) throw error;\n      setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, ...payload } : row));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n  const handleComunicatoChange = (scadenza: ScadenzaImu, tipo: "acconto" | "saldo", nextValue: boolean) => {\n    const comunicatoField = tipo === "acconto" ? "acconto_comunicato" : "saldo_comunicato";\n    const confermaField = tipo === "acconto" ? "conferma_acconto_imu" : "conferma_saldo_imu";\n\n    if (!nextValue) {\n      setPendingComunicato((prev) => prev?.id === scadenza.id && prev.tipo === tipo ? null : prev);\n      void supabase.from("tbscadimu").update({ [comunicatoField]: false, [confermaField]: false }).eq("id", scadenza.id).then(({ error }) => {\n        if (error) {\n          toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n          void loadScadenze();\n          return;\n        }\n        setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, [comunicatoField]: false, [confermaField]: false } : row));\n      });\n      return;\n    }\n\n    const dataField = tipo === "acconto" ? "data_com_acconto" : "data_com_saldo";\n    if (!scadenza[dataField]) {\n      setPendingComunicato({ id: scadenza.id, tipo });\n      toast({\n        title: "Data comunicazione obbligatoria",\n        description: "Inserisci la data di comunicazione per completare Comunicato = SI.",\n        variant: "destructive",\n      });\n      setTimeout(() => document.getElementById(`imu-${tipo}-data-${scadenza.id}`)?.focus(), 0);\n      return;\n    }\n\n    void supabase.from("tbscadimu").update({ [comunicatoField]: true, [confermaField]: true }).eq("id", scadenza.id).then(({ error }) => {\n      if (error) {\n        toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n        void loadScadenze();\n        return;\n      }\n      setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, [comunicatoField]: true, [confermaField]: true } : row));\n    });\n  };\n\n  const handleCommunicationDateChange = async (scadenza: ScadenzaImu, tipo: "acconto" | "saldo", value: string) => {\n    const dataField = tipo === "acconto" ? "data_com_acconto" : "data_com_saldo";\n    const comunicatoField = tipo === "acconto" ? "acconto_comunicato" : "saldo_comunicato";\n    const confermaField = tipo === "acconto" ? "conferma_acconto_imu" : "conferma_saldo_imu";\n\n    await handleUpdateField(scadenza.id, dataField, value);\n\n    if (value && pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === tipo) {\n      const { error } = await supabase.from("tbscadimu").update({ [comunicatoField]: true, [confermaField]: true }).eq("id", scadenza.id);\n      if (error) {\n        toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n        return;\n      }\n      setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, [dataField]: value, [comunicatoField]: true, [confermaField]: true } : row));\n      setPendingComunicato(null);\n    }\n  };\n\n  const enforceCommunicationDate = (scadenza: ScadenzaImu, tipo: "acconto" | "saldo") => {\n    const dataField = tipo === "acconto" ? "data_com_acconto" : "data_com_saldo";\n    if (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === tipo && !scadenza[dataField]) {\n      toast({\n        title: "Data comunicazione obbligatoria",\n        description: "Completa la data prima di lasciare il campo.",\n        variant: "destructive",\n      });\n      setTimeout(() => document.getElementById(`imu-${tipo}-data-${scadenza.id}`)?.focus(), 0);\n    }\n  };\n\n  const handleDichiarazioneImuChange = async (scadenza: ScadenzaImu, nextValue: boolean) => {\n    try {\n      if (!nextValue) {\n        const payload = {\n          dichiarazione_imu: false,\n          data_scad_dichiarazione: null,\n          dichiarazione_presentata: false,\n          conferma_dichiarazione_imu: false,\n        };\n        const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n        if (error) throw error;\n        setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, ...payload } : row));\n        return;\n      }\n\n      const annoBase = scadenza.anno_riferimento ?? Number(filterAnno) ?? currentYear;\n      const annoScadenza = annoBase + 1;\n      const { data: tipoDic, error: tipoError } = await supabase\n        .from("tbtipi_scadenze")\n        .select("data_scadenza, nome")\n        .eq("tipo_scadenza", "imu")\n        .ilike("nome", "%dichiarazione%")\n        .gte("data_scadenza", `${annoScadenza}-01-01`)\n        .lte("data_scadenza", `${annoScadenza}-12-31`)\n        .order("data_scadenza", { ascending: true })\n        .limit(1)\n        .maybeSingle();\n\n      if (tipoError) throw tipoError;\n      if (!tipoDic?.data_scadenza) {\n        toast({\n          title: "Scadenza Dichiarazione IMU non configurata",\n          description: `Configura in Tipi scadenza la Dichiarazione IMU per l'anno ${annoScadenza}.`,\n          variant: "destructive",\n        });\n        return;\n      }\n\n      const payload = {\n        dichiarazione_imu: true,\n        data_scad_dichiarazione: tipoDic.data_scadenza,\n      };\n      const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (error) throw error;\n      setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, ...payload } : row));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n  const handleDichiarazionePresentataChange = async (scadenza: ScadenzaImu, nextValue: boolean) => {\n    try {\n      const payload = { dichiarazione_presentata: nextValue, conferma_dichiarazione_imu: nextValue };\n      const { error } = await supabase.from("tbscadimu").update(payload).eq("id", scadenza.id);\n      if (error) throw error;\n      setScadenze((prev) => prev.map((row) => row.id === scadenza.id ? { ...row, ...payload } : row));\n    } catch (error: any) {\n      toast({ title: "Errore aggiornamento", description: error.message, variant: "destructive" });\n    }\n  };\n\n'''
          if 'handleSoggettoImuChange' not in s:
            s = s.replace(insert_marker, handlers + insert_marker, 1)

          # Header esatto: Soggetto -> Acconto -> Dichiarazione -> Saldo.
          header_start = s.find('    <th className={`${baseHeaderClass} min-w-[120px]`}>Acconto IMU</th>')
          header_end = s.find('    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[300px]', header_start)
          if header_start == -1 or header_end == -1:
            raise SystemExit('header IMU non trovato')
          header_new = '''    <th className={`${baseHeaderClass} min-w-[120px]`}>Soggetto IMU</th>\n    <th className={`${baseHeaderClass} min-w-[120px] print-hide`}>Dovuto</th>\n    <th className={`${baseHeaderClass} min-w-[120px]`}>Comunicato</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[160px] border-r border-slate-500 bg-slate-600 print-hide">\n      Data comunicazione\n    </th>\n    <th className={`${baseHeaderClass} min-w-[140px] print-hide`}>Con dic. IMU</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[170px] border-r border-slate-500 bg-slate-600 print-hide">\n      Data scadenza dic.\n    </th>\n    <th className={`${baseHeaderClass} min-w-[140px] print-hide`}>Dic. presentata</th>\n    <th className={`${baseHeaderClass} min-w-[120px] print-hide`}>Dovuto</th>\n    <th className={`${baseHeaderClass} min-w-[120px]`}>Comunicato</th>\n    <th className="h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[160px] border-r border-slate-500 bg-slate-600 print-hide">\n      Data comunicazione\n    </th>\n'''
          s = s[:header_start] + header_new + s[header_end:]

          # Una colonna in meno: Saldo IMU eliminata dalla UI.
          s = s.replace('colSpan={17}', 'colSpan={16}', 1)

          # Corpo: ricostruisce SOLO le 10 celle centrali nel nuovo ordine.
          body_start = s.find('          <td className={`${baseCellClass} text-center min-w-[120px] ${sectionTone(scadenza.acconto_imu')
          if body_start == -1:
            raise SystemExit('inizio blocco IMU corrente non trovato')
          body_end = s.find('          <td className={`${baseCellClass} min-w-[300px] print-hide', body_start)
          if body_end == -1:
            raise SystemExit('fine blocco IMU corrente non trovato')

          select_cls = 'h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400'
          input_cls = 'h-8 w-full border-slate-300 bg-white text-xs disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400'

          body_new = f'''          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{ backgroundColor: subjectColor(scadenza.acconto_imu, isGreenRow) }}}}>\n            <select value={{scadenza.acconto_imu ? "SI" : "NO"}} onChange={{(e) => void handleSoggettoImuChange(scadenza, e.target.value === "SI")}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px] print-hide" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.acconto_dovuto, scadenza.acconto_comunicato, isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu}} value={{scadenza.acconto_dovuto ? "SI" : "NO"}} onChange={{(e) => {{ const nextValue = e.target.value === "SI"; if (nextValue !== Boolean(scadenza.acconto_dovuto)) handleToggleField(scadenza.id, "acconto_dovuto", scadenza.acconto_dovuto); }}}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.acconto_dovuto, Boolean(scadenza.acconto_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "acconto"), isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu || !scadenza.acconto_dovuto}} value={{Boolean(scadenza.acconto_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "acconto") ? "SI" : "NO"}} onChange={{(e) => handleComunicatoChange(scadenza, "acconto", e.target.value === "SI")}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} min-w-[160px] print-hide" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.acconto_dovuto, Boolean(scadenza.acconto_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "acconto"), isGreenRow) }}}}>\n            <Input id={{`imu-acconto-data-${{scadenza.id}}`}} type="date" disabled={{!scadenza.acconto_imu || !scadenza.acconto_dovuto}} value={{scadenza.data_com_acconto || ""}} onChange={{(e) => void handleCommunicationDateChange(scadenza, "acconto", e.target.value)}} onBlur={{() => enforceCommunicationDate(scadenza, "acconto")}} className="{input_cls}" />\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[140px] print-hide" style={{{{ backgroundColor: declarationColor(scadenza.acconto_imu, scadenza.dichiarazione_imu, scadenza.dichiarazione_presentata, isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu}} value={{scadenza.dichiarazione_imu ? "SI" : "NO"}} onChange={{(e) => void handleDichiarazioneImuChange(scadenza, e.target.value === "SI")}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} min-w-[170px] print-hide" style={{{{ backgroundColor: declarationColor(scadenza.acconto_imu, scadenza.dichiarazione_imu, scadenza.dichiarazione_presentata, isGreenRow) }}}}>\n            <Input type="date" disabled value={{scadenza.data_scad_dichiarazione || ""}} className="{input_cls}" />\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[140px] print-hide" style={{{{ backgroundColor: declarationColor(scadenza.acconto_imu, scadenza.dichiarazione_imu, scadenza.dichiarazione_presentata, isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu || !scadenza.dichiarazione_imu}} value={{scadenza.dichiarazione_presentata ? "SI" : "NO"}} onChange={{(e) => void handleDichiarazionePresentataChange(scadenza, e.target.value === "SI")}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px] print-hide" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.saldo_dovuto, scadenza.saldo_comunicato, isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu}} value={{scadenza.saldo_dovuto ? "SI" : "NO"}} onChange={{(e) => {{ const nextValue = e.target.value === "SI"; if (nextValue !== Boolean(scadenza.saldo_dovuto)) handleToggleField(scadenza.id, "saldo_dovuto", scadenza.saldo_dovuto); }}}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} text-center min-w-[120px]" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.saldo_dovuto, Boolean(scadenza.saldo_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "saldo"), isGreenRow) }}}}>\n            <select disabled={{!scadenza.acconto_imu || !scadenza.saldo_dovuto}} value={{Boolean(scadenza.saldo_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "saldo") ? "SI" : "NO"}} onChange={{(e) => handleComunicatoChange(scadenza, "saldo", e.target.value === "SI")}} className="{select_cls}"><option value="NO">NO</option><option value="SI">SI</option></select>\n          </td>\n\n          <td className="${{baseCellClass}} min-w-[160px] print-hide" style={{{{ backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.saldo_dovuto, Boolean(scadenza.saldo_comunicato) || (pendingComunicato?.id === scadenza.id && pendingComunicato.tipo === "saldo"), isGreenRow) }}}}>\n            <Input id={{`imu-saldo-data-${{scadenza.id}}`}} type="date" disabled={{!scadenza.acconto_imu || !scadenza.saldo_dovuto}} value={{scadenza.data_com_saldo || ""}} onChange={{(e) => void handleCommunicationDateChange(scadenza, "saldo", e.target.value)}} onBlur={{() => enforceCommunicationDate(scadenza, "saldo")}} className="{input_cls}" />\n          </td>\n\n'''
          s = s[:body_start] + body_new + s[body_end:]

          # Stampa: rinomina Acconto -> Soggetto; non tocca Conferma dati.
          s = s.replace('<th>Acconto IMU</th>', '<th>Soggetto IMU</th>', 1)

          # Verifiche finali.
          checks = [
            '>Soggetto IMU</th>',
            'handleSoggettoImuChange',
            'handleDichiarazioneImuChange',
            '.from("tbtipi_scadenze")',
            'value={scadenza.dichiarazione_presentata ? "SI" : "NO"}',
            'value={scadenza.conferma_riga ? "SI" : "NO"}',
            'backgroundColor: sectionColor(scadenza.acconto_imu, scadenza.saldo_dovuto',
          ]
          for c in checks:
            if c not in s:
              raise SystemExit('verifica fallita: ' + c)
          if '>Saldo IMU</th>' in s:
            raise SystemExit('la colonna Saldo IMU non è stata eliminata')
          if s == original:
            raise SystemExit('nessuna modifica prodotta')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/imu.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'Apply exact annotated IMU subject section workflow'
          git push origin main

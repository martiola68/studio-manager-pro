name: Add organi fields v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-organi-fields-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch page and API
        shell: python
        run: |
          from pathlib import Path

          page = Path('src/pages/clienti/organi-sociali.tsx')
          s = page.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} not found')
              s = s.replace(old, new, 1)

          once('  percentuale_partecipazione: "",\n  titolo_possesso:', '  percentuale_partecipazione: "",\n  importo_quota_nominale: "",\n  titolo_possesso:', 'form nominal')
          s = s.replace('  durata_carica: "Fino a revoca",', '  durata_carica: "A revoca",')
          once('  durata_carica: "A revoca",\n  data_scadenza:', '  durata_carica: "A revoca",\n  durata_carica_anni: "",\n  data_scadenza:', 'form years')

          save_utili = '''percentuale_diritti_utili:\n  form.ruolo === "socio"\n    ? form.percentuale_diritti_utili || null\n    : null,\n'''
          once(save_utili, save_utili + '''\nimporto_quota_nominale:\n  form.ruolo === "socio"\n    ? form.importo_quota_nominale || null\n    : null,\n''', 'save nominal')

          save_duration = '''durata_carica:\n  form.ruolo === "socio"\n    ? null\n    : form.durata_carica || null,\n'''
          once(save_duration, save_duration + '''\ndurata_carica_anni:\n  form.ruolo !== "socio" && form.durata_carica === "Anni n."\n    ? Number(form.durata_carica_anni) || null\n    : null,\n''', 'save years')

          # reset after ordinary save
          once('  percentuale_partecipazione: "",\n  presenza: "Presente",', '  percentuale_partecipazione: "",\n  importo_quota_nominale: "",\n  presenza: "Presente",', 'reset nominal')
          once('  durata_carica: "A revoca",\n  data_scadenza: "",', '  durata_carica: "A revoca",\n  durata_carica_anni: "",\n  data_scadenza: "",', 'reset years')

          # reset after linked right save
          linked_reset = '''    percentuale_partecipazione: "",\n    titolo_possesso: "piena_proprieta",'''
          once(linked_reset, '''    percentuale_partecipazione: "",\n    importo_quota_nominale: "",\n    titolo_possesso: "piena_proprieta",''', 'linked reset nominal')
          once('    durata_carica: "Fino a revoca",\n    data_scadenza: "",', '    durata_carica: "A revoca",\n    durata_carica_anni: "",\n    data_scadenza: "",', 'linked reset years')

          # reset when opening a section
          once('    carica: "", percentuale_partecipazione: "", titolo_possesso: "piena_proprieta",', '    carica: "", percentuale_partecipazione: "", importo_quota_nominale: "", titolo_possesso: "piena_proprieta",', 'open reset nominal')
          once('    data_nomina: "", durata_carica: "Fino a revoca", data_scadenza: "", data_cessazione: "",', '    data_nomina: "", durata_carica: "A revoca", durata_carica_anni: "", data_scadenza: "", data_cessazione: "",', 'open reset years')

          edit_quota = '''    percentuale_partecipazione:\n      organo.percentuale_partecipazione\n        ? String(organo.percentuale_partecipazione)\n        : "",\n'''
          once(edit_quota, edit_quota + '''    importo_quota_nominale:\n      organo.importo_quota_nominale != null\n        ? String(organo.importo_quota_nominale)\n        : "",\n''', 'edit nominal')
          once('    durata_carica: organo.durata_carica || "Fino a revoca",', '    durata_carica: ["A revoca", "A tempo indeterminato", "Anni n."].includes(organo.durata_carica) ? organo.durata_carica : "A revoca",', 'edit duration')
          once('    data_scadenza: organo.data_scadenza || "",', '    durata_carica_anni: organo.durata_carica_anni != null ? String(organo.durata_carica_anni) : "",\n    data_scadenza: organo.data_scadenza || "",', 'edit years')

          utili = '''<div style={{marginTop:12}}><label style={labelStyle}>Partecipazione agli utili %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_diritti_utili} onChange={(e)=>setForm((p)=>({...p,percentuale_diritti_utili:e.target.value}))}/></div>'''
          utili_new = '''<div style={{marginTop:12,display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><div><label style={labelStyle}>Valore nominale</label><input type="number" min="0" step="0.01" style={inputStyle} value={form.importo_quota_nominale} onChange={(e)=>setForm((p)=>({...p,importo_quota_nominale:e.target.value}))}/></div><div><label style={labelStyle}>Partecipazione agli utili %</label><input type="number" min="0" max="100" step="0.01" style={inputStyle} value={form.percentuale_diritti_utili} onChange={(e)=>setForm((p)=>({...p,percentuale_diritti_utili:e.target.value}))}/></div></div>'''
          once(utili, utili_new, 'socio UI')

          firmatario = '''  {modalSezione==="amministrazione" && <div style={{marginTop:16,display:"flex",alignItems:"center",justifyContent:"flex-start"}}><label style={{display:"inline-flex",alignItems:"center",gap:9,fontSize:14,fontWeight:600,color:"#334155",cursor:form.soggetto_cliente_id?"pointer":"not-allowed",userSelect:"none"}}><input type="checkbox" checked={Boolean(form.principale)} disabled={!form.soggetto_cliente_id} onChange={(e)=>setForm((p)=>({...p,principale:e.target.checked}))} style={{width:17,height:17,accentColor:"#0d6f9f",cursor:form.soggetto_cliente_id?"pointer":"not-allowed"}}/><span>Firmatario</span></label></div>}'''
          duration_ui = '''  {modalSezione==="amministrazione" && <div style={{marginTop:16,display:"grid",gridTemplateColumns:form.durata_carica==="Anni n."?"1fr 1fr":"1fr",gap:12,alignItems:"end"}}><div><label style={labelStyle}>Scadenza amministratore</label><select style={inputStyle} value={form.durata_carica} onChange={(e)=>setForm((p)=>({...p,durata_carica:e.target.value,durata_carica_anni:e.target.value==="Anni n."?p.durata_carica_anni:""}))}><option value="A revoca">A revoca</option><option value="A tempo indeterminato">A tempo indeterminato</option><option value="Anni n.">Anni n.</option></select></div>{form.durata_carica==="Anni n." && <div><label style={labelStyle}>Numero anni</label><input type="number" min="1" step="1" style={inputStyle} value={form.durata_carica_anni} onChange={(e)=>setForm((p)=>({...p,durata_carica_anni:e.target.value}))}/></div>}</div>}\n'''
          once(firmatario, duration_ui + firmatario, 'administrator UI')

          page.write_text(s, encoding='utf-8')

          api = Path('src/app/api/clienti-organi/route.ts')
          a = api.read_text(encoding='utf-8')
          def aonce(old, new, label):
              global a
              if old not in a:
                  raise SystemExit(f'API {label} not found')
              a = a.replace(old, new, 1)

          aonce('        percentuale_partecipazione,\n        titolo_possesso,', '        percentuale_partecipazione,\n        importo_quota_nominale,\n        titolo_possesso,', 'select nominal')
          aonce('        durata_carica,\n        data_scadenza', '        durata_carica,\n        durata_carica_anni,\n        data_scadenza', 'select years')

          post_quota = '''percentuale_partecipazione:\n  payload.ruolo === "socio"\n    ? payload.percentuale_partecipazione || null\n    : null,\n'''
          aonce(post_quota, post_quota + '''\nimporto_quota_nominale:\n  payload.ruolo === "socio" &&\n  payload.importo_quota_nominale !== "" &&\n  payload.importo_quota_nominale !== undefined\n    ? payload.importo_quota_nominale\n    : null,\n''', 'post nominal')
          aonce('        durata_carica: payload.durata_carica || null,\n        data_scadenza:', '        durata_carica: payload.durata_carica || null,\n        durata_carica_anni: payload.durata_carica === "Anni n." ? payload.durata_carica_anni || null : null,\n        data_scadenza:', 'post years')

          put_quota = '''    percentuale_partecipazione:\n      payload.ruolo === "socio"\n        ? payload.percentuale_partecipazione || null\n        : null,\n'''
          aonce(put_quota, put_quota + '''\n    importo_quota_nominale:\n      payload.ruolo === "socio" &&\n      payload.importo_quota_nominale !== "" &&\n      payload.importo_quota_nominale !== undefined\n        ? payload.importo_quota_nominale\n        : null,\n''', 'put nominal')
          aonce('    durata_carica: payload.durata_carica || null,\n    data_scadenza:', '    durata_carica: payload.durata_carica || null,\n    durata_carica_anni: payload.durata_carica === "Anni n." ? payload.durata_carica_anni || null : null,\n    data_scadenza:', 'put years')
          api.write_text(a, encoding='utf-8')

      - name: Record migration
        run: |
          cat > supabase/migrations/20260911220500_add_organi_nominale_duration_years.sql <<'SQL'
          alter table public.tbclienti_organi
            add column if not exists importo_quota_nominale numeric(15,2),
            add column if not exists durata_carica_anni integer;

          alter table public.tbclienti_organi
            drop constraint if exists tbclienti_organi_durata_carica_anni_check;

          alter table public.tbclienti_organi
            add constraint tbclienti_organi_durata_carica_anni_check
            check (durata_carica_anni is null or durata_carica_anni > 0);
          SQL

      - name: Type check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx src/app/api/clienti-organi/route.ts supabase/migrations/20260911220500_add_organi_nominale_duration_years.sql
          git commit -m "Add nominal share value and administrator duration"
          git pull --rebase origin main
          git push origin HEAD:main

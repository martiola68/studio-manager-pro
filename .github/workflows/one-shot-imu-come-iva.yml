name: One shot - IMU come IVA
on:
  push:
    paths: ['.github/workflows/one-shot-imu-come-iva.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Modifica e commit runtime IMU
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/scadenze/imu.tsx')
          s=p.read_text(encoding='utf-8'); original=s

          s=s.replace('import { Checkbox } from "@/components/ui/checkbox";\n','')
          s=s.replace('const baseHeaderClass =\n  "h-10 px-2 text-center align-middle font-medium text-muted-foreground border-r border-gray-300";', 'const baseHeaderClass =\n  "h-9 px-2 text-center align-middle font-semibold text-slate-50 border-r border-slate-500";')
          s=s.replace('const baseCellClass = "p-2 align-middle border-r border-gray-300";', 'const baseCellClass = "px-2 py-1 align-middle border-r border-gray-300";')

          # operatori per nome completo crescente, non per cognome
          start=s.find('  const sortByCognome =')
          end=s.find('  const operatoriDisponibili =', start)
          if start!=-1 and end!=-1:
            s=s[:start]+'  const sortByNome = (a: string, b: string) => a.localeCompare(b, "it");\n\n'+s[end:]
          s=s.replace(').sort(sortByCognome);', ').sort(sortByNome);',1)

          s=s.replace('<div className="space-y-6">','<div className="flex h-full min-h-0 flex-col gap-4 overflow-hidden bg-slate-200/70 px-3 pb-3 pt-2">',1)
          s=s.replace('<div className="flex items-center justify-between no-print">','<div className="flex shrink-0 items-center justify-between no-print">',1)
          s=s.replace('<div className="grid grid-cols-1 md:grid-cols-3 gap-4 no-print">','<div className="grid shrink-0 grid-cols-1 gap-4 md:grid-cols-3 no-print">',1)
          s=s.replace('<Card>\n            <CardContent className="pt-6">','<Card className="border border-sky-200 bg-slate-50 shadow-sm">\n            <CardContent className="pt-5">',3)
          s=s.replace('<Card className="no-print">\n          <CardHeader>','<Card className="shrink-0 border border-sky-200 bg-slate-50 shadow-sm no-print">\n          <CardHeader className="pb-3">',1)
          s=s.replace('className="pl-10"','className="h-9 border-slate-300 bg-white pl-10"',1)
          s=s.replace('<SelectTrigger>','<SelectTrigger className="h-9 border-slate-300 bg-white">',3)

          s=s.replace('<Card id="imu-print-area">\n          <CardContent className="p-0">','<Card id="imu-print-area" className="flex min-h-0 flex-1 flex-col overflow-hidden border border-sky-200 bg-slate-50 shadow-sm">\n          <CardContent className="min-h-0 flex-1 overflow-hidden p-0">',1)
          s=s.replace('<div className="relative w-full overflow-auto max-h-[600px] no-print">','<div className="relative h-full w-full overflow-auto no-print">',1)
          s=s.replace('<thead className="sticky top-0 z-30 bg-white">','<thead className="sticky top-0 z-30 bg-slate-600 text-white shadow-sm">',1)
          s=s.replace('<tr className="border-b border-gray-300">','<tr className="border-b border-slate-500">',1)
          s=s.replace('sticky-col-header h-10 px-2 text-left align-middle font-medium text-muted-foreground min-w-[320px] border-r border-gray-300 bg-white','sticky-col-header h-9 px-2 text-left align-middle font-semibold text-slate-50 min-w-[320px] border-r border-slate-500 !bg-slate-600',1)
          s=s.replace('h-10 px-2 text-left align-middle font-medium text-muted-foreground','h-9 px-2 text-left align-middle font-semibold text-slate-50')
          s=s.replace('h-10 px-2 text-center align-middle font-medium text-muted-foreground','h-9 px-2 text-center align-middle font-semibold text-slate-50')
          s=s.replace('border-r border-gray-300 bg-white','border-r border-slate-500 bg-slate-600')
          s=s.replace('border-r-0 bg-white print-hide','border-r-0 bg-slate-600 print-hide')

          # tutti i Checkbox operativi IMU -> select SI/NO preservando handleToggleField
          rx=re.compile(r'<Checkbox\s+checked=\{scadenza\.(?P<field>[A-Za-z0-9_]+)\s*\|\|\s*false\}\s+onCheckedChange=\{\(\)\s*=>\s*handleToggleField\(\s*scadenza\.id,\s*"(?P=field)",\s*scadenza\.(?P=field)\s*\)\s*\}\s*/>',re.S)
          def repl(m):
            f=m.group('field')
            return '<select value={scadenza.'+f+' ? "SI" : "NO"} onChange={(e) => { const nextValue = e.target.value === "SI"; if (nextValue !== Boolean(scadenza.'+f+')) handleToggleField(scadenza.id, "'+f+'", scadenza.'+f+'); }} className="h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700"><option value="NO">NO</option><option value="SI">SI</option></select>'
          s,n1=rx.subn(repl,s)

          # eventuali Boolean(...) checkbox
          rx2=re.compile(r'<Checkbox\s+checked=\{Boolean\(scadenza\.(?P<field>[A-Za-z0-9_]+)\)\}\s+onCheckedChange=\{\(\)\s*=>\s*handleToggleField\(\s*scadenza\.id,\s*"(?P=field)",\s*scadenza\.(?P=field)\s*\)\s*\}\s*/>',re.S)
          s,n2=rx2.subn(repl,s)
          if '<Checkbox' in s: raise SystemExit('Checkbox residui presenti in IMU')

          # campi input/textarea completamente bianchi e compatti; niente verde dentro gli input
          s=re.sub(r'className=\{\s*scadenza\.[A-Za-z0-9_]+\s*\?\s*"h-8 text-xs bg-green-500 text-black"\s*:\s*"h-8 text-xs"\s*\}', 'className="h-8 w-full border-slate-300 bg-white text-xs"', s)
          s=s.replace('className="w-full"','className="h-8 w-full border-slate-300 bg-white"')
          s=s.replace('className="min-h-[60px] resize-none"','rows={1} className="h-8 min-h-8 resize-none border-slate-300 bg-white py-1.5"')
          s=s.replace('"w-full",\n      !value ? "text-transparent caret-transparent" : "",','"h-8 w-full border-slate-300 bg-white",\n      !value ? "text-transparent caret-transparent" : "",',1)

          # righe neutre grigio chiarissimo e sticky nominativo coerente
          s=s.replace(': "hover:bg-green-50/40"',': "bg-slate-50 hover:bg-slate-100"',1)
          s=s.replace('isGreenRow ? "!bg-green-300" : "bg-white"','isGreenRow ? "!bg-green-300" : "!bg-slate-50"',1)

          if s==original: raise SystemExit('Nessuna modifica prodotta')
          p.write_text(s,encoding='utf-8')
          print('Checkbox convertiti',n1+n2)
          PY
          grep -q 'bg-slate-200/70' src/pages/scadenze/imu.tsx
          grep -q 'bg-slate-600 text-white' src/pages/scadenze/imu.tsx
          grep -q 'relative h-full w-full overflow-auto' src/pages/scadenze/imu.tsx
          grep -q 'sortByNome' src/pages/scadenze/imu.tsx
          ! grep -q '<Checkbox' src/pages/scadenze/imu.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/imu.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'Restyle IMU schedule to approved IVA layout'
          git push origin main

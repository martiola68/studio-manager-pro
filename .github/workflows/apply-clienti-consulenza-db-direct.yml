name: Apply clienti consulenza DB direct

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-clienti-consulenza-db-direct.yml

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration with direct Postgres connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql             "host=db.ngeltlygytupgdjiagve.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"             -v ON_ERROR_STOP=1             -f supabase/migrations/20260926154500_add_clienti_consulenza_responsabili.sql

      - name: Verify columns
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          count=$(PGPASSWORD="$SUPABASE_DB_PASSWORD" psql             "host=db.ngeltlygytupgdjiagve.supabase.co port=5432 dbname=postgres user=postgres sslmode=require"             -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='tbclienti' and column_name in ('utente_consulenza_id','professionista_consulenza_id');")
          echo "Columns found: $count"
          test "$count" = "2"

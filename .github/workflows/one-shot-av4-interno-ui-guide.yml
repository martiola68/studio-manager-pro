name: One-shot AV4 internal UI guide

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-av4-interno-ui-guide.py
      - scripts/patch-av4-gray-visual-hierarchy.py
      - .github/workflows/one-shot-av4-interno-ui-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply gray visual hierarchy
        run: python scripts/patch-av4-gray-visual-hierarchy.py
      - name: Verify functional anchors and visual hierarchy
        run: |
          grep -q 'function handleChange' src/pages/antiriciclaggio/modello-av4.tsx
          grep -q 'async function salvaAV4' src/pages/antiriciclaggio/modello-av4.tsx
          grep -q 'async function handleInvioPubblico' src/pages/antiriciclaggio/modello-av4.tsx
          grep -q 'AV4HelpButton topic="titolare"' src/pages/antiriciclaggio/modello-av4.tsx
          grep -q 'bg-slate-200/70' src/pages/antiriciclaggio/modello-av4.tsx
          grep -q 'border-slate-300 bg-white' src/pages/antiriciclaggio/modello-av4.tsx
      - name: Commit runtime file
        run: |
          if git diff --quiet -- src/pages/antiriciclaggio/modello-av4.tsx; then
            echo 'No runtime changes produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/antiriciclaggio/modello-av4.tsx
          git commit -m 'Refine AV4 gray visual hierarchy'
          git push origin main

name: One-shot sync tbutenti types
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tbutenti-types-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync tbutenti generated type
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/integrations/supabase/database.types.ts')
          s = p.read_text()
          marker = '      tbutenti: {'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('Blocco tbutenti non trovato')

          brace_start = s.find('{', start)
          depth = 0
          end = None
          for i in range(brace_start, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Fine blocco tbutenti non trovata')

          new_block = '''      tbutenti: {
        Row: {
          id: string
          nome: string
          cognome: string
          email: string
          tipo_utente: string
          ruolo_operatore_id: string | null
          attivo: boolean | null
          created_at: string | null
          updated_at: string | null
          settore: string | null
          responsabile: boolean | null
          studio_id: string | null
          user_id: string | null
          microsoft_connection_id: string | null
          last_seen: string | null
          tipo_rapporto: string | null
          responsabile_paghe: boolean
          responsabile_ferie_permessi: boolean | null
          utente_comunicazioni: boolean
          amministratore_sistema_generale: boolean
        }
        Insert: {
          id?: string
          nome: string
          cognome: string
          email: string
          tipo_utente: string
          ruolo_operatore_id?: string | null
          attivo?: boolean | null
          created_at?: string | null
          updated_at?: string | null
          settore?: string | null
          responsabile?: boolean | null
          studio_id?: string | null
          user_id?: string | null
          microsoft_connection_id?: string | null
          last_seen?: string | null
          tipo_rapporto?: string | null
          responsabile_paghe?: boolean
          responsabile_ferie_permessi?: boolean | null
          utente_comunicazioni?: boolean
          amministratore_sistema_generale?: boolean
        }
        Update: {
          id?: string
          nome?: string
          cognome?: string
          email?: string
          tipo_utente?: string
          ruolo_operatore_id?: string | null
          attivo?: boolean | null
          created_at?: string | null
          updated_at?: string | null
          settore?: string | null
          responsabile?: boolean | null
          studio_id?: string | null
          user_id?: string | null
          microsoft_connection_id?: string | null
          last_seen?: string | null
          tipo_rapporto?: string | null
          responsabile_paghe?: boolean
          responsabile_ferie_permessi?: boolean | null
          utente_comunicazioni?: boolean
          amministratore_sistema_generale?: boolean
        }
        Relationships: [
          {
            foreignKeyName: "tbutenti_microsoft_connection_id_fkey"
            columns: ["microsoft_connection_id"]
            isOneToOne: false
            referencedRelation: "microsoft365_connections"
            referencedColumns: ["id"]
          },
          {
            foreignKeyName: "tbutenti_ruolo_operatore_id_fkey"
            columns: ["ruolo_operatore_id"]
            isOneToOne: false
            referencedRelation: "tbroperatore"
            referencedColumns: ["id"]
          },
          {
            foreignKeyName: "tbutenti_studio_id_fkey"
            columns: ["studio_id"]
            isOneToOne: false
            referencedRelation: "tbstudio"
            referencedColumns: ["id"]
          },
        ]
      }'''

          s = s[:start] + new_block + s[end:]
          p.write_text(s)
          Path('.github/workflows/one-shot-sync-tbutenti-types.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/database.types.ts .github/workflows/one-shot-sync-tbutenti-types.yml
          git commit -m "fix: sincronizza tipi tbutenti con schema reale [tbutenti-types-synced]"
          git push origin main

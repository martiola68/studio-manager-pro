name: Show generated scadenzari status

on:
  push:
    branches: [main]
    paths:
      - scripts/patch-scadenzari-generation-status-v2.py
      - .github/workflows/scadenzari-generation-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime patch
        run: python scripts/patch-scadenzari-generation-status-v2.py

      - name: Verify patch
        run: |
          grep -q 'Generato —' src/pages/impostazioni/scadenzari.tsx
          grep -q 'Da generare' src/pages/impostazioni/scadenzari.tsx
          grep -q 'loadStatoGenerazione' src/pages/impostazioni/scadenzari.tsx
          ! grep -q 'Alla generazione vengono salvati anche gli alert automatici' src/pages/impostazioni/scadenzari.tsx

      - name: Commit runtime change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/impostazioni/scadenzari.tsx
          git commit -m "Show generated scadenzari status by year"
          git push origin HEAD:main

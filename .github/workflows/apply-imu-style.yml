name: Apply IMU visual style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-imu-style.yml
      - scripts/patch-imu-style-once.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply IMU style patch
        run: python scripts/patch-imu-style-once.py
      - name: Verify IMU style
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'border-b border-sky-300' src/pages/scadenze/imu.tsx
          grep -Fq '[&_select]:!text-red-600' src/pages/scadenze/imu.tsx
          grep -q 'if (completed || rowConfirmed) return "bg-blue-100";' src/pages/scadenze/imu.tsx
          grep -q 'if (presentata || rowConfirmed) return "bg-blue-100";' src/pages/scadenze/imu.tsx
          ! grep -q 'bg-green-200' src/pages/scadenze/imu.tsx
          ! grep -q 'bg-red-300' src/pages/scadenze/imu.tsx
          ! grep -q 'bg-slate-200' src/pages/scadenze/imu.tsx
      - name: Commit runtime file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/scadenze/imu.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align IMU colors with CU and IVA"
          git pull --rebase origin main
          git push origin HEAD:main

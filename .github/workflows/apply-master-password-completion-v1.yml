name: Apply master password completion v1

on:
  push:
    branches:
      - security/master-password-completion-v1
    paths:
      - scripts/patch-master-password-completion-v1.mjs
      - .github/workflows/apply-master-password-completion-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply master password protection patch
        run: node scripts/patch-master-password-completion-v1.mjs

      - name: Verify targeted runtime changes
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/security/SensitiveDataMasterGuard.tsx
          grep -q 'SensitiveDataMasterGuard' src/pages/_app.tsx
          grep -q '"/clienti/organi-sociali"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/revisione-controllo"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/controllo-gestione"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/contenzioso"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/payroll"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/antiriciclaggio"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/scadenze"' src/components/security/SensitiveDataMasterGuard.tsx
          grep -q '"/impostazioni/utenti"' src/components/security/SensitiveDataMasterGuard.tsx

      - name: Type check
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/security/SensitiveDataMasterGuard.tsx src/pages/_app.tsx
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "feat: protect sensitive areas with master password"
          git pull --rebase origin security/master-password-completion-v1
          git push origin HEAD:security/master-password-completion-v1

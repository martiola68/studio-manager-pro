name: Fix AML filled status buttons

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-aml-filled-buttons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AML action button classes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/antiriciclaggio/index.tsx')
          s = p.read_text()

          old1 = '''  const getIconBorderClass = (enabled: boolean) => enabled
    ? "border-2 border-lime-500 shadow-[0_0_10px_rgba(132,204,22,0.9)]"
    : "border-2 border-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]";
'''
          new1 = '''  const getIconBorderClass = (enabled: boolean) => enabled
    ? "border border-green-200 bg-green-100 text-green-700"
    : "border border-red-200 bg-red-100 text-red-700";
'''

          old2 = '''  const getAV4IconBorderClass = (row: AV1Row) => {
    const av4Info = getAV4Info(row);
    const av4Ricevuto = av4Info?.compilato_da_cliente || av4Info?.av4_caricato_manualmente || row.stato_pratica === "av4_ricevuto";
    const av4Inviato = av4Info?.Av4InviatoCL || av4Info?.public_sent_at || av4Info?.compilato_da_cliente || av4Info?.av4_caricato_manualmente || row.stato_pratica === "av4_inviato" || row.stato_pratica === "av4_ricevuto";
    if (av4Ricevuto) return "border-2 border-lime-500 shadow-[0_0_10px_rgba(132,204,22,0.9)]";
    if (av4Inviato) return "border-2 border-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.9)]";
    return "border-2 border-red-500 shadow-[0_0_8px_rgba(239,68,68,0.5)]";
  };
'''
          new2 = '''  const getAV4IconBorderClass = (row: AV1Row) => {
    const av4Info = getAV4Info(row);
    const av4Ricevuto = av4Info?.compilato_da_cliente || av4Info?.av4_caricato_manualmente || row.stato_pratica === "av4_ricevuto";
    const av4Inviato = av4Info?.Av4InviatoCL || av4Info?.public_sent_at || av4Info?.compilato_da_cliente || av4Info?.av4_caricato_manualmente || row.stato_pratica === "av4_inviato" || row.stato_pratica === "av4_ricevuto";
    if (av4Ricevuto) return "border border-green-200 bg-green-100 text-green-700";
    if (av4Inviato) return "border border-amber-200 bg-amber-100 text-amber-700";
    return "border border-red-200 bg-red-100 text-red-700";
  };
'''

          old3 = 'className={`rounded-[28px] bg-white p-1 ${getIconBorderClass(!!row.AV1Conferma)}`}'
          new3 = 'className={`rounded-[28px] p-1 ${getIconBorderClass(!!row.AV1Conferma)}`}'
          old4 = 'className={`rounded-[28px] bg-white p-1 ${getIconBorderClass(!!row.AV2Generato)}`}'
          new4 = 'className={`rounded-[28px] p-1 ${getIconBorderClass(!!row.AV2Generato)}`}'
          old5 = 'className={`rounded-[28px] bg-white p-1 ${getAV4IconBorderClass(row)}`}'
          new5 = 'className={`rounded-[28px] p-1 ${getAV4IconBorderClass(row)}`}'

          for old, new, name in [(old1,new1,'getIconBorderClass'),(old2,new2,'getAV4IconBorderClass'),(old3,new3,'AV1 button'),(old4,new4,'AV2 button'),(old5,new5,'AV4 button')]:
              if old not in s:
                  raise SystemExit(f'{name} block not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "studio-manager-bot"
          git config user.email "actions@github.com"
          git add src/pages/antiriciclaggio/index.tsx
          git commit -m "Use filled semantic colors for AML action buttons"
          git push origin HEAD:main

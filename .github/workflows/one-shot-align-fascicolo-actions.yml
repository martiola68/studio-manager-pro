name: Align fascicolo actions

on:
  push:
    paths:
      - '.github/workflows/one-shot-align-fascicolo-actions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch fascicolo actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/antiriciclaggio/fascicolo-documenti.tsx')
          s = p.read_text()
          s = s.replace('import { FileText, Image as ImageIcon, File } from "lucide-react";', 'import { FileText, Image as ImageIcon, File, Trash2 } from "lucide-react";', 1)

          pattern = re.compile(r'''<td className="p-3">\s*<div className="flex items-center justify-center gap-2">\s*<button\s+type="button"\s+onClick=\{\(\) => void handleApriDocumento\(doc\)\}\s+disabled=\{isWorking\}\s+className="rounded-lg border border-blue-200 px-3 py-1\.5 text-sm font-medium text-blue-700 hover:bg-blue-50 disabled:opacity-60"\s*>\s*Apri\s*</button>\s*\{canDelete && \(\s*<button\s+type="button"\s+onClick=\{\(\) => void handleEliminaDocumento\(doc\)\}\s+disabled=\{isWorking\}\s+className="rounded-lg border border-red-200 px-3 py-1\.5 text-sm font-medium text-red-700 hover:bg-red-50 disabled:opacity-60"\s*>\s*Elimina\s*</button>\s*\)\}\s*</div>\s*</td>''', re.S)

          replacement = '''<td className="p-3">
                      <div className="grid grid-cols-[64px_34px] items-center justify-center gap-2">
                        <button
                          type="button"
                          onClick={() => void handleApriDocumento(doc)}
                          disabled={isWorking}
                          className="h-8 w-16 rounded-lg border border-blue-200 px-3 text-sm font-medium text-blue-700 disabled:opacity-60"
                        >
                          Apri
                        </button>
                        {canDelete ? (
                          <button
                            type="button"
                            onClick={() => void handleEliminaDocumento(doc)}
                            disabled={isWorking}
                            className="flex h-8 w-8 items-center justify-center rounded-lg border border-red-200 text-red-600 disabled:opacity-60"
                            title="Elimina documento"
                            aria-label="Elimina documento"
                          >
                            <Trash2 className="h-4 w-4" />
                          </button>
                        ) : (
                          <span className="block h-8 w-8" aria-hidden="true" />
                        )}
                      </div>
                    </td>'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'action block replacements: {n}')
          p.write_text(s2)
          PY

      - name: Commit patch
        run: |
          git config user.name "studio-manager-bot"
          git config user.email "actions@github.com"
          git add src/pages/antiriciclaggio/fascicolo-documenti.tsx
          git commit -m "Align fascicolo document actions"
          git push origin HEAD:main

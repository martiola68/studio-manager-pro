name: Fix Soci e Organi page load

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-organi-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch organi-sociali runtime file
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/clienti/organi-sociali.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          s = s.replace('''useEffect(() => {\n  caricaClienti();\n  caricaNominativi();\n}, []);''', '''useEffect(() => {\n  void caricaClienti();\n}, []);''', 1)

          s = s.replace('''.from("tbclienti")\n .select(`\n  id,\n  ragione_sociale,\n  codice_fiscale,\n  studio_id\n`)\n  .order("ragione_sociale");''', '''.from("tbclienti")\n .select(`\n  id,\n  ragione_sociale,\n  codice_fiscale,\n  studio_id\n`)\n  .eq("cliente", true)\n  .order("ragione_sociale");''', 1)

          s = s.replace('''function apriInserimentoSezione(sezione: "soci" | "amministrazione" | "controllo") {\n  setOrganoInModificaId("");''', '''async function apriInserimentoSezione(sezione: "soci" | "amministrazione" | "controllo") {\n  if (nominativi.length === 0) {\n    await caricaNominativi();\n  }\n\n  setOrganoInModificaId("");''', 1)

          if s == original:
              raise SystemExit('no source changes applied')
          p.write_text(s, encoding='utf-8')

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx
          git commit -m "Fix Soci e Organi blocking initial load"
          git pull --rebase origin main
          git push origin HEAD:main


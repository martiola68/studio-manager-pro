name: Fix Soci e Organi page load

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-organi-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch organi-sociali runtime file
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/clienti/organi-sociali.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          old_effect = '''useEffect(() => {
  caricaClienti();
  caricaNominativi();
}, []);'''
          new_effect = '''useEffect(() => {
  void caricaClienti();
}, []);'''
          if old_effect not in s:
              raise SystemExit('initial load marker not found')
          s = s.replace(old_effect, new_effect, 1)

          old_clienti = '''const { data } = await supabase
  .from("tbclienti")
 .select(`
  id,
  ragione_sociale,
  codice_fiscale,
  studio_id
`)
  .order("ragione_sociale");'''
          new_clienti = '''const { data } = await supabase
  .from("tbclienti")
  .select(`
  id,
  ragione_sociale,
  codice_fiscale,
  studio_id
`)
  .eq("cliente", true)
  .order("ragione_sociale");'''
          if old_clienti not in s:
              raise SystemExit('caricaClienti marker not found')
          s = s.replace(old_clienti, new_clienti, 1)

          old_insert = '''function apriInserimentoSezione(sezione: "soci" | "amministrazione" | "controllo") {
  setOrganoInModificaId("");'''
          new_insert = '''async function apriInserimentoSezione(sezione: "soci" | "amministrazione" | "controllo") {
  if (nominativi.length === 0) {
    await caricaNominativi();
  }

  setOrganoInModificaId("");'''
          if old_insert not in s:
              raise SystemExit('apriInserimentoSezione marker not found')
          s = s.replace(old_insert, new_insert, 1)

          old_edit = '''async function apriModificaSezione(organo: any, sezione: "soci" | "amministrazione" | "controllo") {
  await caricaInModifica(organo);'''
          new_edit = '''async function apriModificaSezione(organo: any, sezione: "soci" | "amministrazione" | "controllo") {
  if (nominativi.length === 0) {
    await caricaNominativi();
  }

  await caricaInModifica(organo);'''
          if old_edit not in s:
              raise SystemExit('apriModificaSezione marker not found')
          s = s.replace(old_edit, new_edit, 1)

          if s == original:
              raise SystemExit('no changes applied')

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'void caricaClienti();' src/pages/clienti/organi-sociali.tsx
          grep -q '.eq("cliente", true)' src/pages/clienti/organi-sociali.tsx
          grep -q 'if (nominativi.length === 0)' src/pages/clienti/organi-sociali.tsx

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize Soci e Organi initial load"
          git pull --rebase origin main
          git push origin HEAD:main


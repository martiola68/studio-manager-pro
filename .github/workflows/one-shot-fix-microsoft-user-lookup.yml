name: One-shot fix Microsoft user lookup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m365-user-lookup-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Microsoft 365 authenticated user lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/microsoft365/index.tsx')
          s=p.read_text()
          old='''.from("tbutenti")
  .select("studio_id, microsoft_connection_id, tipo_utente")
  .eq("id", currentUserId)
  .single();'''
          new='''.from("tbutenti")
  .select("studio_id, microsoft_connection_id, tipo_utente")
  .eq("user_id", currentUserId)
  .single();'''
          if s.count(old)!=1:
              raise SystemExit(f'lookup utente: atteso 1, trovato {s.count(old)}')
          s=s.replace(old,new)
          if 'export default function Microsoft365Page()' not in s:
              raise SystemExit('pagina Microsoft 365 non valida')
          p.write_text(s)
          Path('.github/workflows/one-shot-fix-microsoft-user-lookup.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/microsoft365/index.tsx .github/workflows/one-shot-fix-microsoft-user-lookup.yml
          git commit -m "fix: ripristina lookup connessione Microsoft utente [m365-user-lookup-fixed]"
          git push origin main

name: Apply weekly presence smart base overrides

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-weekly-presence-smart-base-overrides.yml
      - scripts/patch-weekly-presence-smart-base-v2-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected weekly presence merge patch
        run: python scripts/patch-weekly-presence-smart-base-v2-once.py

      - name: Verify merge logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Il calendario Smart è SEMPRE la base principale' src/pages/presenze/assenze-settimanali.tsx
          grep -q 'if (!codice || codice === "-")' src/pages/presenze/assenze-settimanali.tsx
          grep -q 'smart.presenza ? "Pp" : "Ps"' src/pages/presenze/assenze-settimanali.tsx

      - name: Install dependencies
        run: npm ci

      - name: TypeScript guard
        run: npx tsc --noEmit

      - name: Commit runtime page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/assenze-settimanali.tsx
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Use smart schedule when weekly presence is null"
          git pull --rebase origin main
          git push origin HEAD:main

name: Run Soci e Organi sociali refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-refactor-organi-sezioni.yml
      - scripts/refactor-organi-sezioni-once.py
      - scripts/refine-organi-ui-once.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply isolated page refinement
        run: python scripts/refine-organi-ui-once.py

      - name: Verify only target page changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "src/pages/clienti/organi-sociali.tsx"

      - name: Install dependencies
        run: npm ci

      - name: Build guard
        run: npm run build

      - name: Commit page refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx
          git commit -m "Refine Soci e Organi modal actions and colors"
          git push origin HEAD:main

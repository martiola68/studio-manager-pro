name: One-shot CodeQL organi sociali

on:
  push:
    branches:
      - security/codeql-final-organi-20260902
    paths:
      - '.github/workflows/one-shot-codeql-final-organi.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/codeql-final-organi-20260902
          fetch-depth: 0

      - name: Sostituisce solo navigazione verifica TE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/clienti/organi-sociali.tsx')
          s = p.read_text()
          old = '''      onClick={() =>\n        router.push(\n          `/clienti/titolari-effettivi/verifica?cliente_id=${clienteId}`\n        )\n      }'''
          new = '''      onClick={() =>\n        router.push({\n          pathname: \"/clienti/titolari-effettivi/verifica\",\n          query: { cliente_id: clienteId },\n        })\n      }'''
          assert s.count(old) == 1, f'blocco atteso 1 volta, trovato {s.count(old)}'
          p.write_text(s.replace(old, new))
          PY
          git diff --check

      - name: Verifica perimetro
        run: |
          changed=$(git diff --name-only)
          test "$changed" = "src/pages/clienti/organi-sociali.tsx"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/organi-sociali.tsx
          git commit -m "fix: hardening navigazione organi sociali CodeQL"
          git push origin security/codeql-final-organi-20260902

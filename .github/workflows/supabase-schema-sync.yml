name: Supabase Direct DB Test

on:
  workflow_dispatch:

jobs:
  test-direct:
    runs-on: ubuntu-latest

    steps:
      - name: Check direct database DNS
        run: |
          getent ahosts db.ngeltlygytupgdjiagve.supabase.co || true

      - name: Check IPv6 connectivity
        run: |
          ping -6 -c 2 db.ngeltlygytupgdjiagve.supabase.co || true

name: Supabase Schema Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test database connection
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            postgres:17 \
            psql \
              --host=aws-1-eu-central-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.ngeltlygytupgdjiagve \
              --dbname=postgres \
              --command="SELECT current_database(), current_user;"

      - name: Dump current public schema
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          docker run --rm \
            -e PGPASSWORD="$SUPABASE_DB_PASSWORD" \
            -v "$PWD:/workspace" \
            postgres:17 \
            pg_dump \
              --host=aws-1-eu-central-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.ngeltlygytupgdjiagve \
              --dbname=postgres \
              --schema=public \
              --schema-only \
              --no-owner \
              --no-privileges \
              --file=/workspace/supabase/current_schema.sql

      - name: Verify schema file
        run: |
          if [ ! -s supabase/current_schema.sql ]; then
            echo "ERRORE: current_schema.sql non è stato creato o è vuoto."
            exit 1
          fi

          echo "Schema esportato correttamente."
          wc -l supabase/current_schema.sql

      - name: Commit schema changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add supabase/current_schema.sql

          if git diff --cached --quiet; then
            echo "Nessuna modifica dello schema da salvare."
            exit 0
          fi

          git commit -m "chore(db): sync current Supabase schema"
          git push

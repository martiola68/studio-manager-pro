name: Supabase Schema Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Build database URL
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['DB_PASSWORD'], safe=''))")
          echo "SUPABASE_DATABASE_URL=postgresql://postgres.ngeltlygytupgdjiagve:${ENCODED_PASSWORD}@aws-1-eu-central-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"

      - name: Dump current Supabase schema
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DATABASE_URL" \
            --schema public \
            --file supabase/current_schema.sql

      - name: Commit schema changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add supabase/current_schema.sql

          if git diff --cached --quiet; then
            echo "Nessuna modifica dello schema da salvare."
            exit 0
          fi

          git commit -m "chore(db): sync Supabase schema"
          git push

name: Supabase Schema Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pull remote database schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ngeltlygytupgdjiagve
          supabase db pull github_sync

      - name: Commit database schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add supabase/migrations

          if git diff --cached --quiet; then
            echo "Database già allineato con GitHub."
            exit 0
          fi

          git commit -m "chore(db): sync Supabase schema"
          git push

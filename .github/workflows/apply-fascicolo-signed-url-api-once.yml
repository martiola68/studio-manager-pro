name: Apply fascicolo signed URL API

on:
  push:
    branches:
      - main
    paths:
      - scripts/add-fascicolo-signed-url-api-once.mjs
      - .github/workflows/apply-fascicolo-signed-url-api-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add fascicolo signed URL API
        run: node scripts/add-fascicolo-signed-url-api-once.mjs

      - name: Verify API
        run: |
          set -euo pipefail
          test -f src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts
          grep -q 'supabaseAdmin.auth.getUser' src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts
          grep -q 'tbAVFascicoliDocumenti' src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts
          grep -q 'createSignedUrl' src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts

      - name: Commit API file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/api/antiriciclaggio/fascicolo-documenti/signed-url.ts
          if git diff --cached --quiet; then
            echo "No API changes to commit"
            exit 0
          fi
          git commit -m "Add authenticated signed URL endpoint for fascicolo documents"
          git pull --rebase origin main
          git push origin HEAD:main

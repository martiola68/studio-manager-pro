name: Agenda Teams filter fix

on:
  push:
    paths:
      - '.github/workflows/agenda-teams-filter-fix.yml'

permissions:
  contents: write

jobs:
  fix-agenda-teams-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Agenda Teams filtering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/agenda/index.tsx')
          text = path.read_text()
          original = text

          text = text.replace(
            '      riunione_teams: Boolean((master as any).riunione_teams),\n      link_teams: ((master as any).link_teams as string) || null,',
            '      riunione_teams: sortedRows.some((row) => Boolean((row as any).riunione_teams) || Boolean(String((row as any).link_teams || "").trim())),\n      link_teams: (sortedRows.find((row) => Boolean(String((row as any).link_teams || "").trim())) as any)?.link_teams || null,'
          )

          pattern = re.compile(
            r' const teamsEvents = useMemo\(\(\) => \{.*?\n\}, \[groupedEvents, filtroUtenti(?:, filtroSettori, utenti)?\]\);',
            re.S,
          )

          replacement = ''' const teamsEvents = useMemo(() => {
  const activeUserIds = new Set<string>(filtroUtenti);

  if (filtroSettori.length > 0) {
    utenti
      .filter((u) => {
        const settore = normalizeSettore(u.settore);
        return settore && filtroSettori.includes(settore as "Fiscale" | "Consulenza" | "Lavoro");
      })
      .forEach((u) => activeUserIds.add(String(u.id)));
  }

  return groupedEvents
    .filter((e) => {
      // Considera Teams se almeno una riga del gruppo è marcata Teams
      // oppure contiene il relativo link. In questo modo non dipendiamo
      // dalla riga scelta come master del gruppo.
      const isTeams =
        Boolean(e.riunione_teams) ||
        Boolean(String(e.link_teams || "").trim()) ||
        e.rows.some((row) =>
          Boolean((row as any).riunione_teams) ||
          Boolean(String((row as any).link_teams || "").trim())
        );

      if (!isTeams) return false;
      if (activeUserIds.size === 0) return true;

      return e.rows.some((row) =>
        activeUserIds.has(String(row.utente_id || ""))
      );
    })
    .sort(
      (a, b) =>
        safeParseISO(a.data_inizio).getTime() -
        safeParseISO(b.data_inizio).getTime()
    );
}, [groupedEvents, filtroUtenti, filtroSettori, utenti]);'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'Blocco teamsEvents non trovato o ambiguo: {count}')

          if text == original:
            raise SystemExit('Nessuna modifica prodotta')

          path.write_text(text)
          PY

      - name: Commit fix
        run: |
          git config user.name "studio-manager-bot"
          git config user.email "actions@github.com"
          git add src/pages/agenda/index.tsx
          git commit -m "Fix grouped Teams meeting detection and user filter"
          git push origin HEAD:main

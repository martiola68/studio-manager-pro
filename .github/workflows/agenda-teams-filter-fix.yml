name: Revisione snapshot patch runner

on:
  push:
    paths:
      - '.github/workflows/agenda-teams-filter-fix.yml'

permissions:
  contents: write

jobs:
  patch-revisione-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch snapshot soci e organi
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/revisione-controllo/presa-in-carico.tsx')
          s=p.read_text(encoding='utf-8')
          anchor='''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });\nfunction nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }\n'''
          helper='''const incaricoTrasparenzaVuoto = (): IncaricoTrasparenza => ({ ente: "", ateco: "", sede: "", codiceFiscale: "", ruolo: "" });\nfunction nomeCliente(c: Cliente) { return c.ragione_sociale || "Cliente senza denominazione"; }\n\nfunction parseDataOrgano(value: unknown, fineGiornata = false) {\n  if (!value) return null;\n  const raw = String(value).trim();\n  const italiana = raw.match(/^(\\d{2})\\/(\\d{2})\\/(\\d{4})$/);\n  const iso = italiana ? `${italiana[3]}-${italiana[2]}-${italiana[1]}` : raw.slice(0, 10);\n  const data = new Date(`${iso}T${fineGiornata ? "23:59:59" : "00:00:00"}`);\n  return Number.isNaN(data.getTime()) ? null : data;\n}\n\nfunction organoValidoAllaData(organo: any, dataRiferimento: string) {\n  const riferimento = dataRiferimento ? parseDataOrgano(dataRiferimento, true) : new Date();\n  if (!riferimento) return true;\n  const dalRaw = organo?.data_nomina || organo?.data_inizio || organo?.dal || null;\n  const alRaw = organo?.data_cessazione || organo?.data_scadenza || organo?.data_fine || organo?.al || null;\n  const dal = parseDataOrgano(dalRaw, false);\n  const al = parseDataOrgano(alRaw, true);\n  if (dal && dal > riferimento) return false;\n  if (al && al < riferimento) return false;\n  if (organo?.attivo === false && !alRaw) return false;\n  return true;\n}\n'''
          if 'function organoValidoAllaData' not in s:
              if anchor not in s: raise SystemExit('ANCHOR helper non trovato')
              s=s.replace(anchor,helper,1)
          old='supabase.from("tbclienti_organi").select("*").eq("cliente_id", clienteId).eq("attivo", true)'
          if old in s:
              s=s.replace(old,'supabase.from("tbclienti_organi").select("*").eq("cliente_id", clienteId)',1)
          old_counts='''  const soci = (snapshot?.organi_sociali || []).filter((o: any) => o.ruolo === "socio");\n  const amministratori = (snapshot?.organi_sociali || []).filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));\n  const controllo = (snapshot?.organi_sociali || []).filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));\n'''
          new_counts='''  const organiAllaData = (snapshot?.organi_sociali || []).filter((o: any) => organoValidoAllaData(o, dataBilancio));\n  const soci = organiAllaData.filter((o: any) => o.ruolo === "socio");\n  const amministratori = organiAllaData.filter((o: any) => ["amministratore_unico", "amministratore", "presidente_cda", "amministratore_delegato", "liquidatore"].includes(o.ruolo));\n  const controllo = organiAllaData.filter((o: any) => ["sindaco", "presidente_collegio_sindacale", "revisore"].includes(o.ruolo));\n'''
          if old_counts in s:
              s=s.replace(old_counts,new_counts,1)
          if old in s: raise SystemExit('Filtro attivo=true ancora presente')
          if 'function organoValidoAllaData' not in s or 'const organiAllaData' not in s:
              raise SystemExit('Fix snapshot incompleto')
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/revisione-controllo/presa-in-carico.tsx
          if git diff --cached --quiet; then
            echo "Fix già applicato"
            exit 0
          fi
          git commit -m "fix: revision snapshot uses historical company organs"
          git pull --rebase origin main
          git push origin HEAD:main

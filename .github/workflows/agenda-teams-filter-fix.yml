name: Revisione draft snapshot refresh

on:
  push:
    paths:
      - '.github/workflows/agenda-teams-filter-fix.yml'

permissions:
  contents: write

jobs:
  patch-revisione-draft-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh non-finalized draft snapshots
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/pages/revisione-controllo/presa-in-carico.tsx')
          s = p.read_text(encoding='utf-8')

          old = '''    setPreincaricoId(data.id); setPreincaricoStato(data.stato || ""); setPraticaRevisioneId(data.pratica_revisione_id || null); setStep(Math.max(1, Math.min(8, Number(data.step_corrente || 1)))); if (data.snapshot_cliente) setSnapshot(data.snapshot_cliente);\n'''
          new = '''    const praticaGenerata = Boolean(data.pratica_revisione_id) || data.stato === "generato";\n    setPreincaricoId(data.id);\n    setPreincaricoStato(data.stato || "");\n    setPraticaRevisioneId(data.pratica_revisione_id || null);\n    setStep(Math.max(1, Math.min(8, Number(data.step_corrente || 1))));\n    if (praticaGenerata && data.snapshot_cliente) {\n      // Le pratiche finalizzate mantengono lo snapshot congelato nello storico.\n      setSnapshot(data.snapshot_cliente);\n    } else {\n      // Le bozze devono sempre riflettere gli archivi SMP correnti: uno snapshot\n      // salvato prima delle correzioni non deve sovrascrivere i dati appena letti.\n      await caricaSnapshot();\n    }\n'''

          if old not in s:
              if 'const praticaGenerata = Boolean(data.pratica_revisione_id)' in s:
                  print('Fix già applicato')
              else:
                  raise SystemExit('Blocco caricamento bozza non trovato')
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/revisione-controllo/presa-in-carico.tsx
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "fix: refresh audit draft snapshot from current archives"
          git pull --rebase origin main
          git push origin HEAD:main

# trigger

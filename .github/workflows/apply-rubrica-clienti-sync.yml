name: Apply Rubrica client synchronization fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-rubrica-clienti-sync.yml
      - scripts/patch-rubrica-clienti-sync-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted Rubrica patch
        run: python scripts/patch-rubrica-clienti-sync-once.py

      - name: Verify runtime changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const cognomePersonaRaw = isPersonaFisica' src/pages/clienti/index.tsx
          grep -q 'Mostra anche i clienti provenienti direttamente da tbclienti' src/pages/contatti/index.tsx

      - name: Commit runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/clienti/index.tsx src/pages/contatti/index.tsx
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Fix Rubrica synchronization with client registry"
          git pull --rebase origin main
          git push origin HEAD:main

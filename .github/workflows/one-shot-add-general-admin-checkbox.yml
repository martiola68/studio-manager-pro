name: One-shot add general admin checkbox
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[general-admin-checkbox-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch users form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/impostazioni/utenti.tsx')
          s = p.read_text()

          replacements = [
            (
              '  utente_comunicazioni: false,\n});',
              '  utente_comunicazioni: false,\n  amministratore_sistema_generale: false,\n});'
            ),
            (
              '  tipo_utente: formData.tipo_utente,\n  ruolo_operatore_id: formData.ruolo_operatore_id || null,',
              '  tipo_utente: formData.tipo_utente,\n  amministratore_sistema_generale: formData.amministratore_sistema_generale,\n  ruolo_operatore_id: formData.ruolo_operatore_id || null,'
            ),
            (
              '    utente_comunicazioni: Boolean(\n      (utente as any).utente_comunicazioni\n    ),\n  });',
              '    utente_comunicazioni: Boolean(\n      (utente as any).utente_comunicazioni\n    ),\n    amministratore_sistema_generale: Boolean(\n      (utente as any).amministratore_sistema_generale\n    ),\n  });'
            ),
            (
              '      utente_comunicazioni: false,\n    });',
              '      utente_comunicazioni: false,\n      amministratore_sistema_generale: false,\n    });'
            ),
            (
              '<div className="flex items-center space-x-2">\n  <Checkbox\n    id="attivo"',
              '{editingUtente && (\n  <div className="flex items-center space-x-2">\n    <Checkbox\n      id="amministratore_sistema_generale"\n      checked={formData.amministratore_sistema_generale}\n      onCheckedChange={(checked) =>\n        setFormData((prev) => ({\n          ...prev,\n          amministratore_sistema_generale: !!checked,\n        }))\n      }\n    />\n    <Label\n      htmlFor="amministratore_sistema_generale"\n      className="cursor-pointer font-medium"\n    >\n      Amministratore generale di sistema\n    </Label>\n  </div>\n)}\n\n<div className="flex items-center space-x-2">\n  <Checkbox\n    id="attivo"'
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Patch target non univoco: atteso 1, trovato {count}: {old[:80]}')
            s = s.replace(old, new, 1)

          p.write_text(s)
          Path('.github/workflows/one-shot-add-general-admin-checkbox.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/impostazioni/utenti.tsx .github/workflows/one-shot-add-general-admin-checkbox.yml
          git commit -m "feat: aggiunge flag amministratore generale al form utenti [general-admin-checkbox-fixed]"
          git push origin main

name: Apply Rubrica pagination and name sizing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-rubrica-pagination-and-name-size.yml
      - scripts/patch-rubrica-pagination-and-name-size-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted Rubrica patch
        run: python scripts/patch-rubrica-pagination-and-name-size-once.py
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RUBRICA_PAGE_SIZE = 1000' src/services/contattoService.ts
          grep -q 'fetchAllContatti' src/services/contattoService.ts
          grep -q 'text-\[21px\] font-bold text-gray-900' src/pages/contatti/index.tsx
      - name: Commit runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/contattoService.ts src/pages/contatti/index.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load complete Rubrica and refine contact name size"
          git pull --rebase origin main
          git push origin HEAD:main

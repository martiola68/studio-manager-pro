name: Remove Proforma from scadenzari management runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-proforma-scadenzari-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Proforma from scadenzari page only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/impostazioni/scadenzari.tsx')
          s = p.read_text(encoding='utf-8')

          for old in [
              '  proforma: boolean;\n',
              '  { key: "proforma", label: "Proforma", table: "tbscadproforma" },\n',
              '      proforma: true,\n',
          ]:
              if old not in s:
                  raise SystemExit(f'marker missing: {old!r}')
              s = s.replace(old, '', 1)

          start = s.find('      if (scadenzariFlags.proforma) {')
          if start < 0:
              raise SystemExit('Proforma generation block start not found')
          end = s.find('      if (scadenzariFlags.imu) {', start)
          if end < 0:
              raise SystemExit('IMU block not found after Proforma')
          s = s[:start] + s[end:]

          if 'scadenzariFlags.proforma' in s or 'tbscadproforma' in s or 'label: "Proforma"' in s:
              raise SystemExit('Residual Proforma runtime reference found')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify runtime file
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'scadenzariFlags\.proforma|tbscadproforma|label: "Proforma"|proforma: boolean|proforma: true' src/pages/impostazioni/scadenzari.tsx

      - name: Commit runtime change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/impostazioni/scadenzari.tsx
          git commit -m "Remove Proforma from scadenzari management"
          git push origin HEAD:main

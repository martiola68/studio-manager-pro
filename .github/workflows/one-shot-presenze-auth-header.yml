name: One-shot autenticazione solleciti presenze
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[solleciti-presenze-auth-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggiunge token sessione alla sola chiamata solleciti
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/presenze/index.tsx')
          s = p.read_text()
          old = '''        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
        });'''
          new = '''        const supabase = getBrowserSupabaseClient();
        const { data: sessionData } = await supabase.auth.getSession();
        const accessToken = sessionData.session?.access_token;

        if (!accessToken) {
          throw new Error("Sessione non valida");
        }

        const res = await fetch("/api/presenze/sollecita-compilazione", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        });'''
          if s.count(old) != 1:
            raise SystemExit(f'chiamata solleciti attesa 1, trovata {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/one-shot-presenze-auth-header.yml').unlink()
          PY
      - name: Verifica
        run: |
          git diff --check
          git diff -- src/pages/presenze/index.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/presenze/index.tsx .github/workflows/one-shot-presenze-auth-header.yml
          git commit -m "fix: autentica solleciti presenze per studio [solleciti-presenze-auth-fixed]"
          git push origin main

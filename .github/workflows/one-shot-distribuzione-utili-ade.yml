name: One-shot distribuzione utili solo AdE
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[distribuzione-utili-ade-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica correzioni mirate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/pratiche/variazioni.tsx')
          s=p.read_text()
          s=s.replace('''const payload = {\n  ...form,''','''const isDistribuzioneUtili = form.tipo_variazione === "Distribuzione utili";\n\nconst payload = {\n  ...form,\n  ...(isDistribuzioneUtili ? {\n    ente_principale: "AGENZIA_ENTRATE",\n    obbligo_ade: true,\n    giorni_scadenza_cciaa: 0,\n    data_scadenza_cciaa: "",\n    data_evasione_cciaa: "",\n    giorni_scadenza_ade: 30,\n    data_scadenza_ade: aggiungiGiorni(form.data_atto, 30),\n    ricevuta_telematica_ade: "",\n    pratica_chiusa: form.conferma_record,\n    stato: form.conferma_record ? "completata" : "in_lavorazione",\n  } : {}),''',1)
          s=s.replace(''' function aggiornaDataAtto(value: string) {\n  setForm({\n    ...form,\n    data_atto: value,\n    data_scadenza_cciaa: aggiungiGiorni(\n      value,\n      form.giorni_scadenza_cciaa\n    ),\n    data_scadenza_ade: form.obbligo_ade\n      ? aggiungiGiorni(value, form.giorni_scadenza_ade)\n      : "",\n  });\n}''',''' function aggiornaDataAtto(value: string) {\n  const isDistribuzioneUtili = form.tipo_variazione === "Distribuzione utili";\n  setForm({\n    ...form,\n    data_atto: value,\n    data_scadenza_cciaa: isDistribuzioneUtili ? "" : aggiungiGiorni(value, form.giorni_scadenza_cciaa),\n    data_scadenza_ade: isDistribuzioneUtili\n      ? aggiungiGiorni(value, 30)\n      : form.obbligo_ade\n      ? aggiungiGiorni(value, form.giorni_scadenza_ade)\n      : "",\n  });\n}''',1)
          old='''                  onChange={(e) =>\n                    setForm({\n                      ...form,\n                      tipo_variazione: e.target.value,\n                    })\n                  }'''
          new='''                  onChange={(e) => {\n                    const tipo = e.target.value;\n                    const isDistribuzioneUtili = tipo === "Distribuzione utili";\n                    setForm({\n                      ...form,\n                      tipo_variazione: tipo,\n                      ...(isDistribuzioneUtili ? {\n                        ente_principale: "AGENZIA_ENTRATE",\n                        obbligo_ade: true,\n                        genera_verbale: true,\n                        giorni_scadenza_cciaa: 0,\n                        data_scadenza_cciaa: "",\n                        data_evasione_cciaa: "",\n                        giorni_scadenza_ade: 30,\n                        data_scadenza_ade: aggiungiGiorni(form.data_atto, 30),\n                        ricevuta_telematica_ade: "",\n                      } : {}),\n                    });\n                  }}'''
          if old not in s: raise SystemExit('onChange tipo variazione non trovato')
          s=s.replace(old,new,1)
          start=s.index('''              <div className="space-y-1">\n                <label className="text-sm font-medium">\n                  Giorni lavorazione CCIAA''')
          end=s.index('''            </div>\n\n            <div className="grid grid-cols-1 md:grid-cols-4 gap-3">''',start)
          block=s[start:end]
          s=s[:start]+'''              {form.tipo_variazione !== "Distribuzione utili" && (\n                <>\n'''+block+'''                </>\n              )}\n'''+s[end:]
          s=s.replace('''              <label className="flex items-center gap-2">\n                <input\n                  type="checkbox"\n                  checked={form.obbligo_ade}''','''              {form.tipo_variazione !== "Distribuzione utili" && (\n              <label className="flex items-center gap-2">\n                <input\n                  type="checkbox"\n                  checked={form.obbligo_ade}''',1)
          marker='''                Obbligo comunicazione Agenzia Entrate\n              </label>'''
          s=s.replace(marker,marker+'''\n              )}''',1)
          s=s.replace('''                      Giorni lavorazione AdE''','''                      {form.tipo_variazione === "Distribuzione utili" ? "Termine deposito AdE (giorni)" : "Giorni lavorazione AdE"}''',1)
          s=s.replace('''                      Data invio AdE''','''                      {form.tipo_variazione === "Distribuzione utili" ? "Data deposito AdE" : "Data invio AdE"}''',1)
          ricevuta_start=s.index('''                  <div className="space-y-1">\n                    <label className="text-sm font-medium">\n                      Ricevuta telematica''')
          ricevuta_end=s.index('''                  <label className="flex items-center gap-2 mt-6">''',ricevuta_start)
          ricevuta=s[ricevuta_start:ricevuta_end]
          s=s[:ricevuta_start]+'''                  {form.tipo_variazione !== "Distribuzione utili" && (\n'''+ricevuta+'''                  )}\n\n'''+s[ricevuta_end:]
          s=s.replace('''                    Conferma record AdE''','''                    {form.tipo_variazione === "Distribuzione utili" ? "Conferma deposito AdE e chiudi pratica" : "Conferma record AdE"}''',1)
          s=s.replace('''                    <td className="p-2">{formatDateIT(v.data_scadenza_cciaa)}</td>\n                      <td className="p-2">{formatDateIT(v.data_evasione_cciaa)}</td>''','''                    <td className="p-2">{v.tipo_variazione === "Distribuzione utili" ? "-" : formatDateIT(v.data_scadenza_cciaa)}</td>\n                      <td className="p-2">{v.tipo_variazione === "Distribuzione utili" ? "-" : formatDateIT(v.data_evasione_cciaa)}</td>''',1)
          old_click='''      onClick={() => router.push(`/pratiche/${v.pratica_id}`)}'''
          new_click='''      onClick={async () => {\n        const response = await fetch("/api/pratiche/variazioni/apri", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ variazione_id: v.id }),\n        });\n        const result = await response.json();\n        if (!result.success || !result.pratica_id) {\n          alert(result.error || "Impossibile aprire la pratica");\n          return;\n        }\n        router.push(`/pratiche/${result.pratica_id}`);\n      }}'''
          idx=s.index('''  {v.tipo_variazione === "Distribuzione utili" && (''')
          click_idx=s.index(old_click,idx)
          s=s[:click_idx]+new_click+s[click_idx+len(old_click):]
          p.write_text(s)

          api=Path('src/pages/api/pratiche/variazioni/index.ts')
          a=api.read_text()
          old='''if (body.data_comunicazione_ade) {\n  await supabase\n    .from("tbpratiche_step")\n    .update({\n      data_evasione: body.data_comunicazione_ade,\n      stato: "completato",\n      completato: true,\n      data_completamento: new Date().toISOString(),\n      updated_at: new Date().toISOString(),\n    })\n    .eq("variazione_id", id)\n    .eq("codice_step", "COMUNICAZIONE_ADE");\n}\n\nawait aggiornaStatiVariazione(supabase, id);'''
          new='''if (body.data_comunicazione_ade) {\n  await supabase\n    .from("tbpratiche_step")\n    .update({\n      data_evasione: body.data_comunicazione_ade,\n      stato: "completato",\n      completato: true,\n      data_completamento: new Date().toISOString(),\n      updated_at: new Date().toISOString(),\n    })\n    .eq("variazione_id", id)\n    .eq("codice_step", "COMUNICAZIONE_ADE");\n}\n\nconst isDistribuzioneUtili = String(data.tipo_variazione || "").toLowerCase().includes("distribuzione");\nif (isDistribuzioneUtili && body.conferma_record === true) {\n  const now = new Date().toISOString();\n  await supabase\n    .from("tbpratiche_step")\n    .update({\n      stato: "completato",\n      completato: true,\n      data_evasione: body.data_comunicazione_ade || null,\n      data_completamento: now,\n      updated_at: now,\n    })\n    .eq("variazione_id", id);\n\n  if (data.pratica_id) {\n    await supabase\n      .from("tbpratiche")\n      .update({ stato: "Completata", stato_step: "completato", updated_at: now })\n      .eq("id", data.pratica_id);\n  }\n\n  await supabase\n    .from("tbpratiche_variazioni")\n    .update({ stato: "completata", pratica_chiusa: true })\n    .eq("id", id);\n}\n\nawait aggiornaStatiVariazione(supabase, id);'''
          if old not in a: raise SystemExit('blocco PUT API non trovato')
          api.write_text(a.replace(old,new,1))
          Path('.github/workflows/one-shot-distribuzione-utili-ade.yml').unlink()
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/pratiche/variazioni.tsx src/pages/api/pratiche/variazioni/index.ts .github/workflows/one-shot-distribuzione-utili-ade.yml
          git commit -m "fix: distribuzione utili solo Agenzia Entrate [distribuzione-utili-ade-fixed]"
          git push origin main

name: Fix elenco generale clienti attivi v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Applica filtro clienti attivi
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("src/pages/scadenze/elenco-generale.tsx")
          s = p.read_text()
          old = '.eq("studio_id", userData.studio_id)\n  .order("ragione_sociale", { ascending: true });'
          new = '.eq("studio_id", userData.studio_id)\n  .eq("attivo", true)\n  .eq("cliente", true)\n  .order("ragione_sociale", { ascending: true });'
          if old not in s:
              raise SystemExit("Query target non trovata")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/scadenze/elenco-generale.tsx
          git commit -m "fix: filtra elenco generale su clienti attivi" || exit 0
          git push origin main

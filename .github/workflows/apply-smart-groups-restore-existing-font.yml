name: Apply smart groups existing data and font fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-smart-groups-restore-existing-font.yml
      - scripts/patch-smart-groups-restore-existing-and-font-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python scripts/patch-smart-groups-restore-existing-and-font-once.py
      - name: Verify
        run: |
          grep -q 'Compatibilità con il DB precedente' src/pages/api/presenze/smart/gruppi.ts
          grep -q 'font-size: .94rem' src/components/payroll/PayrollMasterGraficaEnhancer.tsx
      - name: Commit runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/api/presenze/smart/gruppi.ts src/components/payroll/PayrollMasterGraficaEnhancer.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore existing smart groups and increase page font"
          git pull --rebase origin main
          git push origin HEAD:main

name: Repair cassetti fiscali layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[cassetti-layout-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore page and apply full width/full height layout
        run: |
          git show ce24005a945707026bb1648f586d4ccd254cd14d:src/pages/cassetti-fiscali/index.tsx > src/pages/cassetti-fiscali/index.tsx
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/cassetti-fiscali/index.tsx')
          s=p.read_text()
          old='<div className="relative w-full overflow-auto max-h-[600px]">'
          new='<div className="relative w-full overflow-auto h-[calc(100vh-250px)] min-h-[600px]">'
          if s.count(old) != 1:
              raise SystemExit(f'altezza tabella: trovato {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)
          Path('.github/workflows/repair-cassetti-layout.yml').unlink()
          PY
      - name: Commit repaired page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/cassetti-fiscali/index.tsx .github/workflows/repair-cassetti-layout.yml
          git commit -m "style: cassetti fiscali a tutta pagina [cassetti-layout-repaired]"
          git push origin main

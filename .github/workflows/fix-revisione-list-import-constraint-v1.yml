name: Fix revisione list import constraint
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Replace side-effecting revision view read
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/api/revisione-controllo/index.ts')
          s = p.read_text()
          old = '''      let query = supabaseAdmin
        .from("vw_revisione_incarichi")
        .select("*")
        .order("ragione_sociale", { ascending: true });

      if (typeof studio_id === "string" && studio_id) {
        query = query.eq("studio_id", studio_id);
      }

      if (typeof attivo === "string") {
        query = query.eq("attivo", attivo === "true");
      }

      const { data, error } = await query;

      if (error) throw error;

      return res.status(200).json({
        success: true,
        data: data || [],
      });'''
          new = '''      let query = supabaseAdmin
        .from("tbrevisione_incarichi")
        .select("*");

      if (typeof studio_id === "string" && studio_id) {
        query = query.eq("studio_id", studio_id);
      }

      if (typeof attivo === "string") {
        query = query.eq("attivo", attivo === "true");
      }

      const { data: incarichi, error } = await query;
      if (error) throw error;

      const clienteIds = Array.from(new Set((incarichi || []).map((r: any) => r.cliente_id).filter(Boolean)));
      const responsabileIds = Array.from(new Set((incarichi || []).map((r: any) => r.responsabile_id).filter(Boolean)));

      const clientiById = new Map<string, any>();
      if (clienteIds.length) {
        const { data: clienti, error: clientiError } = await supabaseAdmin
          .from("tbclienti")
          .select("id,ragione_sociale")
          .in("id", clienteIds);
        if (clientiError) throw clientiError;
        for (const cliente of clienti || []) clientiById.set(cliente.id, cliente);
      }

      const utentiById = new Map<string, any>();
      if (responsabileIds.length) {
        const { data: utenti, error: utentiError } = await supabaseAdmin
          .from("tbutenti")
          .select("id,nome,cognome")
          .in("id", responsabileIds);
        if (utentiError) throw utentiError;
        for (const utente of utenti || []) utentiById.set(utente.id, utente);
      }

      const data = (incarichi || [])
        .map((incarico: any) => {
          const cliente = clientiById.get(incarico.cliente_id);
          const responsabile = incarico.responsabile_id ? utentiById.get(incarico.responsabile_id) : null;
          return {
            ...incarico,
            ragione_sociale: cliente?.ragione_sociale || "Cliente non disponibile",
            responsabile_nome: responsabile?.nome || null,
            responsabile_cognome: responsabile?.cognome || null,
          };
        })
        .sort((a: any, b: any) => String(a.ragione_sociale || "").localeCompare(String(b.ragione_sociale || ""), "it"));

      return res.status(200).json({ success: true, data });'''
          if old not in s:
              raise SystemExit('GET revision list anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Commit source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/api/revisione-controllo/index.ts
          git commit -m "Fix revision list loading constraint error"
          git push origin HEAD:main

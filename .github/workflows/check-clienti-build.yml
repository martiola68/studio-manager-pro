name: Check clienti build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-clienti-build.yml
      - src/pages/clienti/index.tsx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

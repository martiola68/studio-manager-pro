name: One-shot AV4 pubblico guide modali

on:
  push:
    paths:
      - '.github/workflows/one-shot-av4-pubblico-guide-modali.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch solo UI guide AV4 pubblico
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/pages/compilazione-av4/[token].tsx')
          s = p.read_text()

          # Stato esclusivamente UI per la modale di aiuto.
          old = '''  const [signedPdfUrl, setSignedPdfUrl] = useState("");\n  const [form, setForm] = useState<FormState>(emptyForm);'''
          new = '''  const [signedPdfUrl, setSignedPdfUrl] = useState("");\n  const [form, setForm] = useState<FormState>(emptyForm);\n  const [helpTopic, setHelpTopic] = useState<string | null>(null);'''
          assert s.count(old) == 1, f'stato help: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Funzioni UI locali: nessuna modifica a dati o salvataggi.
          marker = '''  function handleChange(\n    e: React.ChangeEvent<HTMLInputElement | HTMLSelectElement | HTMLTextAreaElement>\n  ) {'''
          insert = '''  const helpContents: Record<string, { title: string; body: React.ReactNode }> = {\n    dati: {\n      title: "Come compilare - Dati principali",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Verifica che i dati anagrafici riportati coincidano con il documento di identificazione allegato. Se il domicilio effettivo è diverso da quello risultante dal documento, seleziona l'apposita dichiarazione nella sezione successiva.</p>\n          <p>Le informazioni sono rese ai fini degli obblighi di adeguata verifica previsti dal D.Lgs. 231/2007. I dati dichiarati devono essere completi e veritieri.</p>\n        </div>\n      ),\n    },\n    dichiarazioni: {\n      title: "Come compilare - Dichiarazioni del cliente",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Indica se nascita e residenza coincidono con il documento di identificazione e descrivi con parole semplici e concrete lo scopo e la natura della prestazione professionale richiesta.</p>\n          <p>Esempi: assistenza e consulenza societaria continuativa, tenuta della contabilità, consulenza fiscale, operazione straordinaria, costituzione o modifica societaria.</p>\n        </div>\n      ),\n    },\n    ppe: {\n      title: "Come compilare - Persona politicamente esposta (PPE)",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Seleziona una sola delle tre condizioni proposte. È PPE chi ricopre o ha ricoperto da meno di un anno importanti cariche pubbliche, nonché i familiari e i soggetti che intrattengono notoriamente stretti legami con tali persone.</p>\n          <p>Rientrano, a titolo esemplificativo, cariche di governo nazionali o regionali, parlamentari, vertici di partiti politici, magistrature e organi di rilievo, autorità indipendenti, ambasciatori, vertici delle forze armate e di imprese pubbliche, direzioni apicali del servizio sanitario e di organizzazioni internazionali.</p>\n          <p>Se dichiari di essere PPE, specifica la carica pubblica e, se la qualifica deriva da un legame familiare o d'affari, indica anche il nominativo e il rapporto con il titolare della carica.</p>\n        </div>\n      ),\n    },\n    titolare: {\n      title: "Come compilare - Individuazione del titolare effettivo",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Il titolare effettivo è sempre una persona fisica. Per una società di capitali verifica anzitutto chi possiede, direttamente o indirettamente, una partecipazione superiore al 25% del capitale.</p>\n          <p>Se la proprietà non consente di individuare con certezza il titolare effettivo, considera chi esercita il controllo attraverso la maggioranza dei voti, voti sufficienti per un'influenza dominante o particolari vincoli contrattuali.</p>\n          <p>Solo quando anche questi criteri non permettono un'individuazione univoca, si applica il criterio residuale riferito alle persone fisiche titolari dei poteri di rappresentanza legale, amministrazione o direzione. Se selezioni una delle opzioni che richiede i titolari effettivi, inserisci e salva almeno un nominativo completo di codice fiscale.</p>\n        </div>\n      ),\n    },\n    ppeTitolari: {\n      title: "Come compilare - PPE dei titolari effettivi",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Dopo aver individuato il/i titolare/i effettivo/i, indica se ciascuno rientra o meno nella definizione di persona politicamente esposta.</p>\n          <p>Se almeno un titolare effettivo è PPE, seleziona la relativa dichiarazione e specifica nel campo sottostante nominativo, carica pubblica o legame che determina tale qualifica.</p>\n        </div>\n      ),\n    },\n    fondi: {\n      title: "Come compilare - Relazioni, fondi e mezzi di pagamento",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Descrivi il rapporto tra cliente, eventuale esecutore e titolare effettivo, poi indica in modo concreto da dove provengono le risorse economiche utilizzate nell'operazione.</p>\n          <p>Esempi di provenienza: redditi da attività professionale o d'impresa, disponibilità societarie, risparmi personali, finanziamento bancario, disinvestimento, vendita di beni. Per i mezzi di pagamento indica, ad esempio, bonifico bancario, assegno o altro strumento effettivamente utilizzato.</p>\n          <p>Le informazioni devono essere coerenti con la natura dell'operazione e con quanto noto sul cliente.</p>\n        </div>\n      ),\n    },\n    attivita: {\n      title: "Come compilare - Professione / attività del cliente",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Indica l'attività realmente svolta dal cliente, da quando viene esercitata e l'ambito territoriale prevalente.</p>\n          <p>Usa descrizioni specifiche, ad esempio “commercio all'ingrosso di materiali edili”, “consulenza informatica”, “locazione immobiliare”, evitando formule generiche quando è possibile indicare con maggiore precisione l'attività.</p>\n        </div>\n      ),\n    },\n    firma: {\n      title: "Come completare e trasmettere il modulo",\n      body: (\n        <div className="space-y-3 text-sm leading-6 text-slate-700">\n          <p>Completa luogo e data, quindi utilizza “Stampa / Salva PDF” per generare il documento da sottoscrivere.</p>\n          <p>Dopo la firma, carica il PDF firmato nell'apposito campo. Prima di premere “Salva e chiudi” verifica che tutte le dichiarazioni selezionate e gli eventuali titolari effettivi inseriti siano corretti.</p>\n          <p>Il comando “Salva e chiudi” conclude la compilazione e rende il collegamento non più riutilizzabile.</p>\n        </div>\n      ),\n    },\n  };\n\n  const HelpButton = ({ topic }: { topic: string }) => (\n    <button\n      type="button"\n      onClick={() => setHelpTopic(topic)}\n      className="rounded-md border border-sky-200 bg-sky-50 px-3 py-1.5 text-xs font-medium text-sky-700 hover:bg-sky-100"\n    >\n      Come compilare\n    </button>\n  );\n\n'''
          assert s.count(marker) == 1, f'marker handleChange: atteso 1, trovato {s.count(marker)}'
          s = s.replace(marker, insert + marker, 1)

          # Dati principali: aggiunge solo pulsante guida nell'header.
          old = '''                <CardHeader>\n                  <CardTitle>Dati principali</CardTitle>\n                </CardHeader>'''
          new = '''                <CardHeader>\n                  <div className="flex items-center justify-between gap-3">\n                    <CardTitle>Dati principali</CardTitle>\n                    <HelpButton topic="dati" />\n                  </div>\n                </CardHeader>'''
          assert s.count(old) == 1, f'header dati: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Dichiarazioni cliente.
          old = '''                <CardHeader>\n                  <CardTitle>Dichiarazioni del cliente</CardTitle>\n                </CardHeader>'''
          new = '''                <CardHeader>\n                  <div className="flex items-center justify-between gap-3">\n                    <CardTitle>Dichiarazioni del cliente</CardTitle>\n                    <HelpButton topic="dichiarazioni" />\n                  </div>\n                </CardHeader>'''
          assert s.count(old) == 1, f'header dichiarazioni: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Sezioni interne: sostituisce solo i titoli testuali con titolo + pulsante.
          replacements = [
            ('<div className="font-semibold">Persona politicamente esposta</div>', '<div className="flex items-center justify-between gap-3"><div className="font-semibold">Persona politicamente esposta</div><HelpButton topic="ppe" /></div>'),
            ('<div className="font-semibold">PPE titolari effettivi</div>', '<div className="flex items-center justify-between gap-3"><div className="font-semibold">PPE titolari effettivi</div><HelpButton topic="ppeTitolari" /></div>'),
            ('<div className="font-semibold">Professione / attività del cliente</div>', '<div className="flex items-center justify-between gap-3"><div className="font-semibold">Professione / attività del cliente</div><HelpButton topic="attivita" /></div>'),
          ]
          for old, new in replacements:
            assert s.count(old) == 1, f'sezione {old}: atteso 1, trovato {s.count(old)}'
            s = s.replace(old, new, 1)

          # Guida titolare effettivo posizionata accanto al blocco introduttivo, senza alterarne il testo.
          old = '''                    <div className="text-sm leading-6 text-gray-700">\n                      - ai fini dell’identificazione del Titolare Effettivo'''
          new = '''                    <div className="flex justify-end">\n                      <HelpButton topic="titolare" />\n                    </div>\n\n                    <div className="text-sm leading-6 text-gray-700">\n                      - ai fini dell’identificazione del Titolare Effettivo'''
          assert s.count(old) == 1, f'guida titolare: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Guida relazioni/fondi prima del relativo blocco di campi.
          old = '''                    <div>\n                      <label className="mb-1 block text-sm font-medium">\n                        Che le relazioni intercorrenti tra il Cliente e il titolare effettivo'''
          new = '''                    <div className="flex justify-end">\n                      <HelpButton topic="fondi" />\n                    </div>\n\n                    <div>\n                      <label className="mb-1 block text-sm font-medium">\n                        Che le relazioni intercorrenti tra il Cliente e il titolare effettivo'''
          assert s.count(old) == 1, f'guida fondi: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Firma: pulsante guida nell'header.
          old = '''                <CardHeader>\n                  <CardTitle>Firma</CardTitle>\n                </CardHeader>'''
          new = '''                <CardHeader>\n                  <div className="flex items-center justify-between gap-3">\n                    <CardTitle>Firma</CardTitle>\n                    <HelpButton topic="firma" />\n                  </div>\n                </CardHeader>'''
          assert s.count(old) == 1, f'header firma: atteso 1, trovato {s.count(old)}'
          s = s.replace(old, new, 1)

          # Rimuove esclusivamente il gigantesco allegato note dalla card Firma.
          start = '                    <div className="md:col-span-2 whitespace-pre-line text-xs leading-5 text-gray-700">\n{`Allegato alla Dichiarazione del Cliente'
          end = 'articolo.`}\n                    </div>\n\n'
          i = s.find(start)
          assert i >= 0, 'inizio blocco note non trovato'
          j = s.find(end, i)
          assert j >= 0, 'fine blocco note non trovato'
          j += len(end)
          s = s[:i] + s[j:]

          # Modale unica esclusivamente visiva, montata fuori da print-area.
          marker = '''            </div>\n          </CardContent>\n        </Card>\n      </div>\n    </div>\n  );'''
          modal = '''            </div>\n\n            {helpTopic && helpContents[helpTopic] && (\n              <div\n                className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 p-4"\n                onMouseDown={(e) => {\n                  if (e.target === e.currentTarget) setHelpTopic(null);\n                }}\n              >\n                <div className="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-xl bg-white shadow-2xl">\n                  <div className="flex items-start justify-between gap-4 border-b px-6 py-4">\n                    <h2 className="text-lg font-semibold text-slate-900">\n                      {helpContents[helpTopic].title}\n                    </h2>\n                    <button\n                      type="button"\n                      onClick={() => setHelpTopic(null)}\n                      className="rounded-md px-2 py-1 text-xl leading-none text-slate-500 hover:bg-slate-100"\n                      aria-label="Chiudi guida"\n                    >\n                      ×\n                    </button>\n                  </div>\n                  <div className="px-6 py-5">{helpContents[helpTopic].body}</div>\n                  <div className="flex justify-end border-t px-6 py-4">\n                    <button\n                      type="button"\n                      onClick={() => setHelpTopic(null)}\n                      className="rounded-md bg-sky-600 px-4 py-2 text-sm font-medium text-white hover:bg-sky-700"\n                    >\n                      Ho capito\n                    </button>\n                  </div>\n                </div>\n              </div>\n            )}\n          </CardContent>\n        </Card>\n      </div>\n    </div>\n  );'''
          assert s.count(marker) == 1, f'marker modale: atteso 1, trovato {s.count(marker)}'
          s = s.replace(marker, modal, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/pages/compilazione-av4/[token].tsx

      - name: Verifica che la logica critica non sia stata toccata
        run: |
          git diff --unified=0 -- src/pages/compilazione-av4/[token].tsx | grep -E '^[+-].*(payload|handleSubmit|validateTitolariPrimaDelSalvataggio|handleUploadSignedPdf|\.from\(|public_token|public_enabled|TitolariEffettiviForm)' && { echo 'ERRORE: diff su logica critica'; exit 1; } || true

      - name: Commit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/compilazione-av4/[token].tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: aggiunge guide contestuali AV4 pubblico"
          git push origin main

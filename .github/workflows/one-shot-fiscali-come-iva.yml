name: One shot - Fiscali come IVA

on:
  push:
    paths:
      - '.github/workflows/one-shot-fiscali-come-iva.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Modifica runtime scadenzario Fiscali
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/scadenze/fiscali.tsx')
          s = p.read_text(encoding='utf-8')
          original = s

          # Operatori per nome, poi cognome.
          s = s.replace('.order("cognome", { ascending: true });', '.order("nome", { ascending: true }).order("cognome", { ascending: true });', 1)

          # Helper SI/NO compatto come IVA.
          old = '''  const renderSiNoSelect = (\n    scadenza: ScadenzaFiscali,\n    field: keyof ScadenzaFiscali\n  ) => (\n    <Select\n      value={scadenza[field] ? "SI" : "NO"}\n      onValueChange={(value) =>\n        handleUpdateField(scadenza.id, field, value === "SI")\n      }\n    >\n      <SelectTrigger className="w-full">\n        <SelectValue />\n      </SelectTrigger>\n      <SelectContent>\n        <SelectItem value="SI">SI</SelectItem>\n        <SelectItem value="NO">NO</SelectItem>\n      </SelectContent>\n    </Select>\n  );'''
          new = '''  const renderSiNoSelect = (\n    scadenza: ScadenzaFiscali,\n    field: keyof ScadenzaFiscali\n  ) => (\n    <select\n      value={scadenza[field] ? "SI" : "NO"}\n      onChange={(e) =>\n        handleUpdateField(scadenza.id, field, e.target.value === "SI")\n      }\n      className="h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700"\n    >\n      <option value="NO">NO</option>\n      <option value="SI">SI</option>\n    </select>\n  );'''
          if old not in s: raise SystemExit('renderSiNoSelect non trovato')
          s = s.replace(old, new, 1)

          old = '''  const renderCheck = (\n    scadenza: ScadenzaFiscali,\n    field: keyof ScadenzaFiscali\n  ) => (\n    <Checkbox\n      checked={Boolean(scadenza[field])}\n      onCheckedChange={() => handleToggleField(scadenza.id, field, scadenza[field])}\n    />\n  );'''
          new = '''  const renderCheck = (\n    scadenza: ScadenzaFiscali,\n    field: keyof ScadenzaFiscali\n  ) => (\n    <select\n      value={scadenza[field] ? "SI" : "NO"}\n      onChange={(e) => {\n        const nextValue = e.target.value === "SI";\n        if (nextValue !== Boolean(scadenza[field])) {\n          handleToggleField(scadenza.id, field, scadenza[field]);\n        }\n      }}\n      className="h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700"\n    >\n      <option value="NO">NO</option>\n      <option value="SI">SI</option>\n    </select>\n  );'''
          if old not in s: raise SystemExit('renderCheck non trovato')
          s = s.replace(old, new, 1)

          # Canvas e pannelli fissi.
          s = s.replace('<div className="space-y-6">', '<div className="flex h-full min-h-0 flex-col gap-4 overflow-hidden bg-slate-200/70 px-3 pb-3 pt-2">', 1)
          s = s.replace('<div className="flex items-center justify-between gap-4 flex-wrap">', '<div className="flex shrink-0 flex-wrap items-center justify-between gap-4">', 1)
          s = s.replace('<div className="grid grid-cols-1 md:grid-cols-3 gap-4">', '<div className="grid shrink-0 grid-cols-1 gap-4 md:grid-cols-3">', 1)

          # Tre statistiche.
          s = s.replace('<Card>\n          <CardContent className="pt-6">', '<Card className="border border-sky-200 bg-slate-50 shadow-sm">\n          <CardContent className="pt-5">', 3)

          # Filtri.
          s = s.replace('<Card>\n        <CardHeader>\n          <CardTitle>Filtri e Ricerca</CardTitle>', '<Card className="shrink-0 border border-sky-200 bg-slate-50 shadow-sm">\n        <CardHeader className="pb-3">\n          <CardTitle>Filtri e Ricerca</CardTitle>', 1)
          s = s.replace('className="pl-10"', 'className="h-9 border-slate-300 bg-white pl-10"', 1)
          s = s.replace('<SelectTrigger>\n                  <SelectValue placeholder="Utente Operatore" />', '<SelectTrigger className="h-9 border-slate-300 bg-white">\n                  <SelectValue placeholder="Utente Operatore" />', 1)
          s = s.replace('<SelectTrigger>\n                  <SelectValue placeholder="Anno consultazione" />', '<SelectTrigger className="h-9 border-slate-300 bg-white">\n                  <SelectValue placeholder="Anno consultazione" />', 1)

          # Card tabella = spazio residuo; scroll solo dentro tabella.
          s = s.replace('<Card>\n        <CardContent className="p-0">\n          <div className="relative w-full overflow-auto max-h-[600px]">', '<Card className="flex min-h-0 flex-1 flex-col overflow-hidden border border-sky-200 bg-slate-50 shadow-sm">\n        <CardContent className="min-h-0 flex-1 overflow-hidden p-0">\n          <div className="relative h-full w-full overflow-auto">', 1)

          # Header tabella uguale IVA.
          s = s.replace('<thead className="[&_tr]:border-b sticky top-0 z-30 bg-white shadow-sm">', '<thead className="sticky top-0 z-30 bg-slate-600 text-white shadow-sm [&_tr]:border-b [&_tr]:border-slate-500">', 1)
          s = s.replace('<tr className="border-b transition-colors hover:bg-muted/50 data-[state=selected]:bg-muted">', '<tr className="border-b border-slate-500">', 1)
          s = s.replace('h-12 px-2', 'h-9 px-2')
          s = s.replace('font-medium text-muted-foreground', 'font-semibold text-slate-50')
          s = s.replace('sticky-col-header border-r min-w-[300px]', 'sticky-col-header border-r border-slate-500 !bg-slate-600 !text-slate-50 min-w-[300px]', 1)

          # Celle compatte.
          s = s.replace('className="p-2 align-middle', 'className="px-2 py-1 align-middle')
          s = s.replace('className={`p-2 align-middle', 'className={`px-2 py-1 align-middle')

          # Tipo Redditi bianco e compatto.
          s = s.replace('<SelectTrigger className="w-full">\n      <SelectValue placeholder="Tipo Redditi" />', '<SelectTrigger className="h-8 w-full border-slate-300 bg-white">\n      <SelectValue placeholder="Tipo Redditi" />', 1)

          # ISA: checkbox -> SI/NO.
          old = '''  <Checkbox\n    checked={Boolean(scadenza.soggetto_isa)}\n    onCheckedChange={() => handleToggleSoggettoIsa(scadenza)}\n  />'''
          new = '''  <select\n    value={scadenza.soggetto_isa ? "SI" : "NO"}\n    onChange={(e) => {\n      const nextValue = e.target.value === "SI";\n      if (nextValue !== Boolean(scadenza.soggetto_isa)) {\n        handleToggleSoggettoIsa(scadenza);\n      }\n    }}\n    className="h-8 w-[70px] rounded-md border border-slate-300 bg-white px-2 text-center text-xs font-semibold text-slate-700"\n  >\n    <option value="NO">NO</option>\n    <option value="SI">SI</option>\n  </select>'''
          if old not in s: raise SystemExit('checkbox ISA non trovato')
          s = s.replace(old, new, 1)

          # Tutti gli input data della griglia completamente bianchi.
          s = s.replace('''className={\n                            scadenza.conferma_ires_saldo_acconto\n                              ? "w-full bg-green-500 text-black"\n                              : "w-full"\n                          }''', 'className="h-8 w-full border-slate-300 bg-white"', 1)
          s = s.replace('''className={\n                            scadenza.conferma_invio_dichiarazione\n                              ? "w-full bg-green-500 text-black"\n                              : "w-full"\n                          }''', 'className="h-8 w-full border-slate-300 bg-white"', 1)
          s = s.replace('''className={\n                            scadenza.conferma_irap_invio_dichiarazione\n                              ? "w-full bg-green-500 text-black"\n                              : "w-full"\n                          }''', 'className="h-8 w-full border-slate-300 bg-white"', 1)
          s = s.replace('''className={\n                            scadenza.conferma_ires_secondo_acconto\n                              ? "w-full bg-green-500 text-black"\n                              : "w-full"\n                          }''', 'className="h-8 w-full border-slate-300 bg-white"', 1)

          # Note compatte e bianche.
          s = s.replace('className="w-full min-h-[60px]"', 'rows={1}\n                          className="h-8 min-h-8 w-full resize-none border-slate-300 bg-white py-1.5"', 1)

          # Riga neutra leggermente grigia, come IVA; confermate verdi restano verdi.
          s = s.replace(': "hover:bg-green-50"', ': "bg-slate-50 hover:bg-slate-100"', 1)
          s = s.replace('''backgroundColor: scadenza.conferma_riga\n                            ? "#dcfce7"\n                            : "#ffffff",''', '''backgroundColor: scadenza.conferma_riga\n                            ? "#dcfce7"\n                            : "#f8fafc",''', 1)

          # Checkbox import non più necessario dopo conversione completa nella griglia.
          if '<Checkbox' not in s:
            s = s.replace('import { Checkbox } from "@/components/ui/checkbox";\n', '')

          if s == original:
            raise SystemExit('Nessuna modifica prodotta')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verifica modifiche reali
        run: |
          grep -q 'bg-slate-200/70' src/pages/scadenze/fiscali.tsx
          grep -q 'bg-slate-600 text-white' src/pages/scadenze/fiscali.tsx
          grep -q 'border-sky-200' src/pages/scadenze/fiscali.tsx
          grep -q 'relative h-full w-full overflow-auto' src/pages/scadenze/fiscali.tsx
          grep -q 'order("nome", { ascending: true })' src/pages/scadenze/fiscali.tsx
          grep -q '<option value="SI">SI</option>' src/pages/scadenze/fiscali.tsx
          ! grep -q '<Checkbox' src/pages/scadenze/fiscali.tsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit runtime Fiscali
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/scadenze/fiscali.tsx
          git diff --cached --quiet && exit 1
          git commit -m 'Restyle Fiscali schedule to approved IVA layout'
          git push origin main

name: Apply fascicolo signed read patch

on:
  push:
    branches:
      - main
    paths:
      - scripts/patch-fascicolo-signed-read-once.mjs
      - .github/workflows/apply-fascicolo-signed-read-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fascicolo patch
        run: node scripts/patch-fascicolo-signed-read-once.mjs

      - name: Verify targeted change
        run: |
          set -euo pipefail
          grep -q '/api/antiriciclaggio/fascicolo-documenti/signed-url' src/pages/antiriciclaggio/fascicolo-documenti.tsx
          grep -q 'Authorization:' src/pages/antiriciclaggio/fascicolo-documenti.tsx

      - name: Commit runtime file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/antiriciclaggio/fascicolo-documenti.tsx
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git commit -m "Fix fascicolo document opening via authenticated signed URL"
          git pull --rebase origin main
          git push origin HEAD:main

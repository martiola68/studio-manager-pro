name: One-shot fix Microsoft user lookup v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[m365-user-lookup-v2-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix lookup and tenant limits
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/microsoft365/index.tsx')
          s=p.read_text()
          old='.eq("id", currentUserId)\n  .single();'
          new='.eq("user_id", currentUserId)\n  .single();'
          if old not in s:
              raise SystemExit('lookup target not found')
          s=s.replace(old,new,1)
          old2='const maxConnectionsReached = connections.length >= 2;'
          new2='const maxConnections = studioId === "f9d3ca10-6134-4061-a2b4-0be74e8c7654" ? 2 : 1;\nconst maxConnectionsReached = connections.length >= maxConnections;'
          if old2 in s:
              s=s.replace(old2,new2,1)
          old3='if (connections.length >= 2) {\n    setError("Limite massimo di 2 connessioni Microsoft raggiunto per questo studio");'
          new3='if (connections.length >= maxConnections) {\n    setError(`Limite massimo di ${maxConnections} connessione${maxConnections > 1 ? "i" : ""} Microsoft raggiunto per questo studio`);'
          if old3 in s:
              s=s.replace(old3,new3,1)
          p.write_text(s)
          Path('.github/workflows/one-shot-fix-microsoft-user-lookup-v2.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/microsoft365/index.tsx .github/workflows/one-shot-fix-microsoft-user-lookup-v2.yml
          git commit -m "fix: Microsoft lookup e limite tenant per studio [m365-user-lookup-v2-fixed]"
          git push origin main
